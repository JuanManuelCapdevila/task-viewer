<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🌾 Task Guardian</title>
<script nonce="{{nonce}}" src="{{markedUri}}"></script>
<script nonce="{{nonce}}" src="{{mermaidUri}}"></script>
<style>
  /* Fuentes vendorizadas (media/vendor/fonts/): un webview no tiene por qué
     tener salida a Google Fonts (proxy corporativo, política de red del
     editor, offline) — si el @font-face falla, el <h1> cae a un fallback
     con negrita por defecto + text-shadow duro, que se ve "relleno". */
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{pixelify400Uri}}") format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url("{{pixelify500Uri}}") format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url("{{pixelify600Uri}}") format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url("{{pixelify700Uri}}") format('woff2'); }
  @font-face { font-family: 'Press Start 2P'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{pressStart2pUri}}") format('woff2'); }
  @font-face { font-family: 'Archivo Black'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{archivoBlackUri}}") format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{spaceGrotesk400Uri}}") format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: swap; src: url("{{spaceGrotesk700Uri}}") format('woff2'); }
  @font-face { font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{vt323Uri}}") format('woff2'); }
  :root {
    color-scheme: light;
    --sky-a: #ffedb0;
    --sky-b: #ffc79a;
    --grass-a: #c3e89c;
    --grass-b: #9fd977;
    --wood: #b98653;
    --wood-dark: #7d5330;
    --wood-darker: #4a2c17;
    --wood-light: #e6b781;
    --parchment: #fffbf0;
    --parchment-alt: #faedcd;
    --ink: #4a3420;
    --muted: #9c8158;
    --gold: #ffc233;
    --gold-dark: #d99e28;
    --leaf: #66bb6a;
    --leaf-dark: #3d8b41;
    --heart: #e6483f;
    --panel: var(--parchment);
    --border: var(--wood-dark);
    --text: var(--ink);
    --accent: var(--leaf-dark);
    --accent-bg: var(--parchment-alt);
    --code-bg: #f3e2bb;
    --content-font: {{contentFontFamily}};
    --heading-font: {{headingFontFamily}};
    --mono-font: {{monoFontFamily}};
    --sublabel-font: var(--mono-font);
    --heading-transform: none;

    /* ---- variables "estructurales": lo que distingue la piel pixel-art
       de otras pieles (neo-retro, etc.) más allá de la paleta de color.
       Cada tema redefine este bloque completo bajo un selector de body. ---- */
    --bar-bg: linear-gradient(180deg, var(--wood-light), var(--wood));
    --frame-clip: polygon(
      0 12px, 12px 12px, 12px 0,
      calc(100% - 12px) 0, calc(100% - 12px) 12px, 100% 12px,
      100% calc(100% - 12px), calc(100% - 12px) calc(100% - 12px), calc(100% - 12px) 100%,
      12px 100%, 12px calc(100% - 12px), 0 calc(100% - 12px)
    );
    --frame-shadow: 0 0 0 4px var(--wood-darker), 0 10px 0 rgba(0, 0, 0, .28), 0 14px 18px rgba(0, 0, 0, .35);
    --btn-shadow: inset 1px 1px 0 rgba(255, 255, 255, .35), inset -2px -2px 0 rgba(0, 0, 0, .25), 0 3px 0 var(--wood-darker);
    --btn-shadow-active: inset 1px 1px 0 rgba(255, 255, 255, .35), inset -2px -2px 0 rgba(0, 0, 0, .25), 0 0 0 var(--wood-darker);
    --btn-active-transform: translateY(3px);
    --page-bg-color: transparent;
    --page-bg-image: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 42%, var(--grass-b) 42%, var(--grass-a) 100%);
    --page-bg-size: auto;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    font-family: var(--content-font);
    font-size: 15px;
    background-color: var(--page-bg-color);
    background-image: var(--page-bg-image);
    background-size: var(--page-bg-size);
    background-attachment: fixed;
    color: var(--text);
    image-rendering: pixelated;
  }

  /* ---------- marco general tipo "consola / cofre" (pixel) o panel recto (neo-retro) ---------- */
  .game-frame {
    position: relative;
    height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    background: var(--wood-dark);
    padding: 6px;
    box-shadow: var(--frame-shadow);
    clip-path: var(--frame-clip);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
    padding: 14px 20px;
    background: var(--bar-bg);
    border-bottom: 4px solid var(--wood-darker);
  }
  header h1 {
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    color: var(--parchment);
    text-shadow: 2px 2px 0 var(--wood-darker);
    letter-spacing: 0.5px;
  }
  header h1 .sprout { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-6deg); }
  }
  header .path {
    color: var(--parchment);
    opacity: .75;
    font-size: 11px;
    font-family: monospace;
    margin-top: 4px;
  }
  header .subtitle {
    font-family: var(--sublabel-font);
    font-size: 11px;
    color: var(--parchment);
    opacity: .85;
    letter-spacing: .5px;
  }
  .toolbar { display: flex; gap: 10px; align-items: center; }
  .stat-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    background: var(--wood-darker);
    color: var(--gold);
    border: 2px solid var(--wood-darker);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .12);
    font-size: 12px;
    white-space: nowrap;
  }

  select#project-select {
    padding: 8px 10px;
    border: 2px solid var(--wood-darker);
    background: var(--parchment);
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    max-width: 200px;
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .18);
  }
  select#project-select:focus {
    outline: none;
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .18), 0 0 0 2px var(--gold);
  }

  input[type="search"] {
    padding: 8px 10px;
    border: 2px solid var(--wood-darker);
    background: var(--parchment);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    width: 220px;
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .18);
  }
  input[type="search"]::placeholder { color: var(--muted); }
  input[type="search"]:focus {
    outline: none;
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .18), 0 0 0 2px var(--gold);
  }

  button {
    padding: 8px 14px;
    border: 2px solid var(--wood-darker);
    background: var(--bar-bg);
    color: var(--parchment);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    box-shadow: var(--btn-shadow);
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .3);
    transition: transform .05s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active {
    transform: var(--btn-active-transform);
    box-shadow: var(--btn-shadow-active);
  }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--parchment);
    overflow: hidden;
  }

  .table-wrap { overflow: auto; border-bottom: 4px solid var(--wood-dark); max-height: 42vh; background: var(--parchment); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0;
    text-align: left;
    background: var(--bar-bg);
    color: var(--parchment);
    padding: 9px 12px;
    border-bottom: 3px solid var(--wood-darker);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .35);
  }
  tbody td {
    padding: 9px 12px;
    border-bottom: 2px dashed var(--parchment-alt);
    vertical-align: middle;
    color: var(--ink);
  }
  tbody tr { cursor: pointer; background: var(--parchment); transition: transform .05s ease; }
  tbody tr:nth-child(even) { background: var(--parchment-alt); }
  tbody tr:hover { background: var(--accent-bg); box-shadow: inset 0 0 0 2px var(--gold); }
  tbody tr.selected {
    background: var(--accent-bg);
    box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--wood-darker);
  }
  tbody tr.selected td:first-child::before { content: '▶ '; color: var(--gold-dark); }

  code { font-family: var(--mono-font); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    background: var(--wood-darker);
    color: var(--gold);
    border: 1px solid var(--wood-darker);
  }

  .gem {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    font-size: 14px;
    background: var(--wood-darker);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08);
    filter: grayscale(1);
    opacity: .35;
  }
  .gem.lit {
    filter: grayscale(0) saturate(1.4);
    opacity: 1;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08), 0 0 8px var(--gold);
  }

  .empty { padding: 32px; color: var(--muted); text-align: center; font-size: 13px; }
  .empty::before { content: '🪹'; display: block; font-size: 30px; margin-bottom: 8px; }

  .viewer { display: flex; flex-direction: column; overflow: hidden; }
  .tabs {
    display: flex; gap: 4px; padding: 10px 12px 0;
    border-bottom: 4px solid var(--wood-dark);
    overflow-x: auto;
    background: var(--parchment-alt);
  }
  .tab {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    border: 2px solid var(--wood-darker);
    border-bottom: none;
    background: var(--wood);
    color: var(--parchment);
    cursor: pointer;
    white-space: nowrap;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .3);
    transform: translateY(2px);
  }
  .tab:hover { filter: brightness(1.12); }
  .tab.active {
    background: var(--parchment);
    color: var(--ink);
    text-shadow: none;
    border-color: var(--gold-dark);
    border-bottom-color: var(--parchment);
    transform: translateY(0);
  }
  .doc {
    flex: 1;
    overflow: auto;
    padding: 26px 34px;
    background: var(--parchment);
    background-image:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .015) 0 2px, transparent 2px 4px);
  }
  .doc-inner { max-width: 900px; margin: 0 auto; line-height: 1.65; }
  .doc-inner h1 {
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 16px;
    line-height: 1.6;
    border-bottom: 3px dashed var(--gold-dark);
    padding-bottom: 10px;
  }
  .doc-inner h2 {
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 17px;
    margin-top: 30px;
    color: var(--wood-dark);
    border-left: 6px solid var(--gold);
    padding-left: 10px;
  }
  .doc-inner h3 { font-family: var(--heading-font); font-size: 14.5px; color: var(--leaf-dark); }
  .doc-inner code { background: var(--code-bg); padding: 1px 5px; font-size: 0.9em; border: 1px solid var(--wood-dark); }
  .doc-inner pre { background: var(--code-bg); padding: 12px 14px; border: 2px solid var(--wood-dark); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .1); overflow-x: auto; }
  .doc-inner pre code { background: none; padding: 0; border: none; }
  .doc-inner table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
  .doc-inner th, .doc-inner td { border: 2px solid var(--wood-dark); padding: 7px 10px; text-align: left; }
  .doc-inner th { background: var(--parchment-alt); }
  .doc-inner blockquote {
    border-left: 4px solid var(--gold);
    background: var(--parchment-alt);
    margin: 0;
    padding: 8px 14px;
    color: var(--muted);
  }
  .doc-inner li.task-list-item { list-style: none; margin-left: -22px; }
  .doc-inner li.task-list-item input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin-right: 6px;
    accent-color: var(--leaf-dark);
    cursor: pointer;
    vertical-align: middle;
  }
  .doc-inner li.task-list-item input[type="checkbox"]:disabled { cursor: wait; opacity: .5; }
  .doc-inner .other-editable {
    display: inline;
    min-width: 60px;
    padding: 0 3px;
    border-bottom: 1px dashed var(--muted);
    cursor: text;
    outline: none;
  }
  .doc-inner .other-editable:hover { border-bottom-color: var(--gold-dark); }
  .doc-inner .other-editable:focus { border-bottom: 1px solid var(--leaf-dark); background: var(--accent-bg); }
  .doc-inner .other-editable.saving { opacity: .6; }
  .save-toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    padding: 8px 14px;
    background: var(--wood-darker);
    color: var(--gold);
    border: 2px solid var(--wood-dark);
    font-size: 12px;
    box-shadow: 0 3px 0 var(--wood-darker);
    z-index: 2000;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .15s ease, transform .15s ease;
    pointer-events: none;
  }
  .save-toast.show { opacity: 1; transform: translateY(0); }
  .save-toast.error { color: var(--heart); border-color: var(--heart); }
  .doc-inner pre.mermaid { background: var(--panel); text-align: center; }
  .mermaid-error { color: var(--heart); font-size: 12.5px; text-align: left; background: var(--code-bg); padding: 10px 12px; border: 2px solid var(--heart); }
  .placeholder { color: var(--muted); text-align: center; padding: 70px 20px; font-size: 13px; }
  .placeholder::before { content: '🧭'; display: block; font-size: 34px; margin-bottom: 10px; }

  .diagram-frame {
    display: flex;
    flex-direction: column;
    border: 3px solid var(--wood-dark);
    box-shadow: 0 4px 0 var(--wood-darker);
    margin: 18px 0;
    background: var(--panel);
  }
  .diagram-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-bottom: 3px solid var(--wood-dark);
    background: var(--bar-bg);
  }
  .diagram-toolbar button {
    padding: 3px 10px;
    font-size: 13px;
    line-height: 1.3;
  }
  .diagram-toolbar .dz-level {
    font-size: 12px;
    color: var(--parchment);
    text-shadow: 1px 1px 0 rgba(0, 0, 0, .3);
    min-width: 44px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .diagram-toolbar .dz-hint {
    margin-left: auto;
    font-size: 11px;
    color: var(--parchment);
    opacity: .8;
  }
  .diagram-viewport {
    position: relative;
    overflow: hidden;
    height: min(65vh, 620px);
    cursor: grab;
    touch-action: none;
    background: var(--panel);
  }
  .diagram-viewport.dragging { cursor: grabbing; }
  .diagram-pan {
    position: absolute;
    top: 0;
    left: 0;
    width: max-content;
    transform-origin: 0 0;
  }
  .diagram-pan svg { display: block; }
  .diagram-frame.fullscreen {
    position: fixed;
    inset: 14px;
    z-index: 1000;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
  }
  .diagram-frame.fullscreen .diagram-viewport { height: auto; flex: 1; }

  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: var(--parchment-alt); }
  ::-webkit-scrollbar-thumb { background: var(--wood); border: 3px solid var(--parchment-alt); }
  ::-webkit-scrollbar-thumb:hover { background: var(--wood-dark); }

  /* ---------------------------------------------------------------------
     Tema "Neo-Retro Dev Deck" (design_1.md): paleta R2-D2, sin gradientes,
     bordes negros gruesos, sombras duras sin blur, esquinas rectas, grid
     de cuaderno de ingeniería de fondo. Redefine únicamente las variables
     de :root — el resto de las reglas ya está escrito en términos de esas
     variables, así que no hace falta tocar los selectores de componentes.
     --------------------------------------------------------------------- */
  body.theme-neo-retro {
    --wood: #a8a8a8;
    --wood-dark: #005596;
    --wood-darker: #000000;
    --wood-light: #3d84c4;
    --parchment: #ffffff;
    --parchment-alt: #f1f1ee;
    --ink: #000000;
    --muted: #6b6b6b;
    --gold: #e11927;
    --gold-dark: #b8121e;
    --leaf: #005596;
    --leaf-dark: #005596;
    --heart: #e11927;
    --code-bg: #f1f1ee;

    --bar-bg: var(--wood-dark);
    --frame-clip: none;
    --frame-shadow: 8px 8px 0 var(--wood-darker);
    --btn-shadow: 4px 4px 0 var(--wood-darker);
    --btn-shadow-active: 2px 2px 0 var(--wood-darker);
    --btn-active-transform: translate(2px, 2px);
    --page-bg-color: #fdfbf7;
    --page-bg-image:
      linear-gradient(rgba(0, 0, 0, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 0, 0, .05) 1px, transparent 1px);
    --page-bg-size: 40px 40px;
    --heading-transform: uppercase;
  }
  /* El marco pixel usa .game-frame como "borde" de color sólido (padding +
     background); en neo-retro ese mismo elemento pasa a ser un panel recto
     con sombra dura — clip-path: none ya lo deja rectangular. */
  body.theme-neo-retro .game-frame { padding: 4px; }
</style>
</head>
<body class="{{themeClass}}">
<div class="game-frame">
<header>
  <div>
    <h1><span class="sprout">🌾</span> Task Guardian</h1>
    <div class="subtitle">task-viewer</div>
    <div class="path" id="root-path"></div>
  </div>
  <div class="toolbar">
    <select id="project-select"></select>
    <span class="stat-chip">📋 <span id="task-count">0</span> quests</span>
    <input type="search" id="search" placeholder="Filtrar por id o título…" />
    <button id="refresh">🔄 Actualizar</button>
  </div>
</header>
<main>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Título</th>
          <th>Specs</th>
          <th>❓ Open Q.</th>
          <th>🗺️ Diagramas</th>
          <th>Última actualización</th>
        </tr>
      </thead>
      <tbody id="task-rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" hidden>No hay tasks en este proyecto</div>
  </div>
  <div class="viewer">
    <div class="tabs" id="tabs"></div>
    <div class="doc" id="doc">
      <div class="placeholder">Seleccioná un task de la tabla para ver sus specs.</div>
    </div>
  </div>
</main>
</div>
<div class="save-toast" id="save-toast"></div>

<script nonce="{{nonce}}">
// Tema 'base' fijo (no sigue prefers-color-scheme): el panel de diagramas
// siempre es claro, así que el tema de mermaid debe serlo también o el
// contraste se rompe (p.ej. el tema 'dark' usa grises pensados para fondo
// oscuro, ilegibles sobre pergamino).
// Los colores del diagrama no pueden ser CSS vars directamente (mermaid
// genera un <style> propio con valores ya resueltos), así que se leen los
// custom properties del tema activo en runtime y se traducen a hex/rgb acá.
// Así el mismo bloque sirve para 'pixel' y 'neo-retro' sin duplicar mermaid.initialize.
function cssVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  securityLevel: 'loose',
  // htmlLabels: los nodos se miden como <div> real (foreignObject) en vez de
  // con la heurística de ancho de <text> de mermaid, que con una fuente
  // pixel de métricas atípicas subestima el alto necesario y recorta la
  // segunda línea de las etiquetas largas.
  flowchart: { htmlLabels: true },
  themeVariables: {
    fontFamily: 'var(--content-font)',
    background: cssVar('--parchment'),
    primaryColor: cssVar('--parchment-alt'),
    primaryBorderColor: cssVar('--wood-dark'),
    primaryTextColor: cssVar('--ink'),
    secondaryColor: cssVar('--code-bg'),
    tertiaryColor: cssVar('--parchment'),
    lineColor: cssVar('--wood-dark'),
    textColor: cssVar('--ink'),
    mainBkg: cssVar('--parchment-alt'),
    actorBkg: cssVar('--parchment-alt'),
    actorBorder: cssVar('--wood-dark'),
    actorTextColor: cssVar('--ink'),
    actorLineColor: cssVar('--wood-dark'),
    signalColor: cssVar('--ink'),
    signalTextColor: cssVar('--ink'),
    labelBoxBkgColor: cssVar('--parchment-alt'),
    labelBoxBorderColor: cssVar('--wood-dark'),
    labelTextColor: cssVar('--ink'),
    loopTextColor: cssVar('--ink'),
    noteBkgColor: cssVar('--code-bg'),
    noteBorderColor: cssVar('--gold-dark'),
    noteTextColor: cssVar('--ink'),
    activationBkgColor: cssVar('--code-bg'),
    activationBorderColor: cssVar('--wood-dark'),
    sequenceNumberColor: cssVar('--parchment'),
    edgeLabelBackground: cssVar('--parchment'),
    clusterBkg: cssVar('--code-bg'),
    clusterBorder: cssVar('--wood-dark')
  }
});

// --- Puente con el extension host: reemplaza los fetch() de la versión
// standalone por mensajes postMessage/onDidReceiveMessage, correlacionados
// por un id de request. El host (extension.js) resuelve cada 'type' contra
// lib/core.js y responde con el mismo id.
const vscode = acquireVsCodeApi();
let reqSeq = 0;
const pending = new Map();
window.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg || !msg.id || !pending.has(msg.id)) return;
  const { resolve, reject } = pending.get(msg.id);
  pending.delete(msg.id);
  if (msg.error) reject(new Error(msg.error));
  else resolve(msg.result);
});
function callHost(type, payload) {
  const id = `r${++reqSeq}`;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    vscode.postMessage({ id, type, payload });
  });
}

const LAST_PROJECT_KEY = 'task-viewer:last-project';
const state = { projects: [], selectedProject: null, tasks: [], selectedId: null, selectedFile: null, fileCache: new Map() };

const el = (id) => document.getElementById(id);

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function tabLabel(file, task) {
  if (file.kind === 'index') return '📖 Índice';
  if (file.kind === 'open-questions') return '❓ Open Questions';
  if (file.kind === 'diagrams') return '🗺️ Diagramas';
  if (file.kind === 'spec') {
    const m = file.name.match(/^spec-(\d+)-(.+)\.md$/);
    if (m) return `📜 Spec ${m[1]} — ${m[2].replace(/-/g, ' ')}`;
  }
  return file.name;
}

async function loadProjects() {
  state.projects = await callHost('projects');
  renderProjectSelect();
}

function renderProjectSelect() {
  const select = el('project-select');
  select.innerHTML = '';
  state.projects.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.id} (${p.taskCount})`;
    select.appendChild(opt);
  });
  if (state.selectedProject && state.projects.some((p) => p.id === state.selectedProject)) {
    select.value = state.selectedProject;
  } else if (state.projects.length) {
    select.value = state.projects[0].id;
  }
}

async function selectProject(projectId, taskId, fileName) {
  state.selectedProject = projectId;
  state.selectedId = null;
  state.selectedFile = null;
  state.fileCache.clear();
  el('project-select').value = projectId;
  vscode.setState({ ...(vscode.getState() || {}), lastProject: projectId });

  await loadTasks();
  if (taskId && state.tasks.some((t) => t.id === taskId)) {
    selectTask(taskId, fileName);
  } else {
    renderTabs();
  }
}

async function loadTasks() {
  if (!state.selectedProject) {
    state.tasks = [];
    renderTable();
    return;
  }
  state.tasks = await callHost('tasks', { project: state.selectedProject }).catch(() => []);
  renderTable();
}

function renderTable() {
  const query = el('search').value.trim().toLowerCase();
  const rows = el('task-rows');
  rows.innerHTML = '';

  const filtered = state.tasks.filter((t) =>
    !query || t.id.toLowerCase().includes(query) || t.title.toLowerCase().includes(query)
  );

  el('empty-msg').hidden = filtered.length > 0;
  el('task-count').textContent = filtered.length;

  filtered.forEach((t) => {
    const tr = document.createElement('tr');
    tr.dataset.id = t.id;
    if (t.id === state.selectedId) tr.classList.add('selected');
    tr.innerHTML = `
      <td><code>${t.id}</code></td>
      <td>${t.title}</td>
      <td><span class="badge">📜 x${t.specCount}</span></td>
      <td><span class="gem ${t.hasOpenQuestions ? 'lit' : ''}" title="${t.hasOpenQuestions ? 'Tiene preguntas abiertas' : 'Sin preguntas abiertas'}">❓</span></td>
      <td><span class="gem ${t.hasDiagrams ? 'lit' : ''}" title="${t.hasDiagrams ? 'Tiene diagramas' : 'Sin diagramas'}">🗺️</span></td>
      <td>${fmtDate(t.lastUpdated)}</td>
    `;
    tr.addEventListener('click', () => selectTask(t.id));
    rows.appendChild(tr);
  });
}

function selectTask(taskId, fileName) {
  state.selectedId = taskId;
  state.selectedFile = fileName || null;
  renderTable();
  renderTabs();
}

function renderTabs() {
  const task = state.tasks.find((t) => t.id === state.selectedId);
  const tabs = el('tabs');
  tabs.innerHTML = '';
  if (!task) {
    renderDoc();
    return;
  }

  if (!state.selectedFile && task.files.length) state.selectedFile = task.files[0].name;

  task.files.forEach((file) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (file.name === state.selectedFile ? ' active' : '');
    tab.textContent = tabLabel(file, task);
    tab.addEventListener('click', () => selectTask(task.id, file.name));
    tabs.appendChild(tab);
  });

  renderDoc();
}

async function renderDoc() {
  const doc = el('doc');
  const task = state.tasks.find((t) => t.id === state.selectedId);
  if (!task || !state.selectedFile) {
    doc.innerHTML = '<div class="placeholder">Seleccioná un task de la tabla para ver sus specs.</div>';
    return;
  }

  const project = state.selectedProject;
  const cacheKey = `${project}/${task.id}/${state.selectedFile}`;
  let content = state.fileCache.get(cacheKey);
  if (content === undefined) {
    doc.innerHTML = '<div class="placeholder">Cargando…</div>';
    try {
      const data = await callHost('file', { project, task: task.id, file: state.selectedFile });
      content = data.content ?? `Error: ${data.error || 'no se pudo cargar'}`;
    } catch (err) {
      content = `Error: ${err.message}`;
    }
    state.fileCache.set(cacheKey, content);
  }

  // Preserva bloques ```mermaid como <pre class="mermaid"> antes/en vez del
  // <pre><code class="language-mermaid"> que emite marked, para que mermaid.run
  // los detecte.
  const html = marked.parse(content, { mangle: false, headerIds: false });
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  wrapper.querySelectorAll('code.language-mermaid').forEach((codeEl) => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(pre);
  });

  doc.innerHTML = '<div class="doc-inner"></div>';
  doc.querySelector('.doc-inner').appendChild(wrapper);

  wireInteractiveFields(doc.querySelector('.doc-inner'), project, task.id, state.selectedFile, content);

  // Espera a que la fuente elegida termine de cargar: si mermaid mide el
  // texto de los nodos antes de eso, lo hace contra la fuente de fallback
  // y el tamaño de caja calculado queda corto para la fuente real.
  await document.fonts.ready.catch(() => {});

  // Se renderiza cada bloque por separado (no en batch): un diagrama con
  // error de sintaxis no debe dejar corruptos/superpuestos los demás.
  const mermaidBlocks = [...doc.querySelectorAll('.mermaid')];
  for (const block of mermaidBlocks) {
    const source = block.textContent;
    try {
      const id = `mermaid-${Math.random().toString(36).slice(2)}`;
      const { svg } = await mermaid.render(id, source);
      block.replaceWith(buildDiagramFrame(svg));
    } catch (err) {
      block.innerHTML = `<div class="mermaid-error">Error renderizando diagrama: ${err.message || err}</div>`;
      console.error('Error renderizando mermaid', err);
    }
  }
}

let toastTimer = null;
function showToast(message, isError) {
  const toast = el('save-toast');
  toast.textContent = message;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

async function saveFileContent(project, taskId, fileName, content) {
  const result = await callHost('saveFile', { project, task: taskId, file: fileName, content });
  if (result.error) throw new Error(result.error);
}

// Habilita los checkboxes de listas de tareas (`- [ ]` / `- [x]`) que marked
// renderiza como <input disabled>, y los liga de vuelta a su línea exacta en
// el markdown fuente para persistir el cambio con un PUT al archivo completo.
// El emparejamiento asume que marked emite los checkboxes en el mismo orden
// en que aparecen en el texto (cierto en un render de documento completo, sin
// reordenamientos) — si el conteo no coincide, no se tocan (mejor no-editable
// que editar la línea equivocada). También vuelve editable el texto libre de
// las opciones "**Other:**", sincronizando su checkbox (texto no vacío ⇒
// tildado, vacío/`______` ⇒ destildado) — igual convención que ya usan los
// open-questions existentes.
function wireInteractiveFields(container, project, taskId, fileName, initialContent) {
  let currentContent = initialContent;
  let saveChain = Promise.resolve();

  // Serializa los PUT (una promesa a la vez) para que dos ediciones rápidas
  // (p.ej. tildar un checkbox y tipear en "Other" casi al mismo tiempo) no
  // se pisen escribiendo cada una sobre un `currentContent` desactualizado.
  function persist(lineIndex, newLine) {
    const lines = currentContent.split('\n');
    lines[lineIndex] = newLine;
    const updated = lines.join('\n');
    currentContent = updated;

    const attempt = saveChain.then(() => saveFileContent(project, taskId, fileName, updated));
    saveChain = attempt.then(() => {}, () => {});
    return attempt.then(
      () => {
        state.fileCache.set(`${project}/${taskId}/${fileName}`, updated);
        showToast('Guardado ✓');
      },
      (err) => {
        showToast(`No se pudo guardar: ${err.message}`, true);
        throw err;
      }
    );
  }

  const lineIndices = [];
  currentContent.split('\n').forEach((line, i) => {
    if (/^\s*-\s\[[ xX]\]\s/.test(line)) lineIndices.push(i);
  });

  const checkboxes = [...container.querySelectorAll('input[type="checkbox"]')];
  if (checkboxes.length === 0 || checkboxes.length !== lineIndices.length) {
    if (checkboxes.length !== lineIndices.length) {
      console.warn('Checkboxes en el DOM no coinciden con los del markdown fuente; se dejan de solo lectura.');
    }
    return;
  }

  checkboxes.forEach((cb, idx) => {
    const lineIndex = lineIndices[idx];
    cb.disabled = false;

    cb.addEventListener('change', () => {
      const wasChecked = cb.checked;
      cb.disabled = true;
      const line = currentContent.split('\n')[lineIndex];
      const newLine = line.replace(/\[[ xX]\]/, wasChecked ? '[x]' : '[ ]');
      persist(lineIndex, newLine)
        .catch(() => { cb.checked = !wasChecked; })
        .finally(() => { cb.disabled = false; });
    });

    const li = cb.closest('li');
    const otherLabel = li && [...li.querySelectorAll('strong')].find((s) => s.textContent.trim() === 'Other:');
    if (!otherLabel) return;

    const span = document.createElement('span');
    span.className = 'other-editable';
    span.contentEditable = 'true';
    span.spellcheck = false;
    let node = otherLabel.nextSibling;
    while (node) {
      const next = node.nextSibling;
      span.appendChild(node);
      node = next;
    }
    otherLabel.after(span);

    span.addEventListener('blur', () => {
      const line = currentContent.split('\n')[lineIndex];
      const trimmed = span.textContent.trim();
      const isFilled = trimmed.length > 0 && trimmed !== '______';
      const bodyText = isFilled ? trimmed : '______';
      const newLine = line.replace(
        /^(\s*-\s\[)[ xX](\]\s\*\*Other:\*\*\s?).*$/,
        (_m, pre, mid) => `${pre}${isFilled ? 'x' : ' '}${mid}${bodyText}`
      );
      if (newLine === line) return;
      span.classList.add('saving');
      cb.checked = isFilled;
      persist(lineIndex, newLine).finally(() => span.classList.remove('saving'));
    });

    span.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      span.blur();
    });
  });
}

// Envuelve el SVG de un diagrama ya renderizado en un frame con
// zoom (rueda / botones), pan (arrastrar) y pantalla completa, sin
// depender de ninguna librería extra.
function buildDiagramFrame(svgMarkup) {
  const frame = document.createElement('div');
  frame.className = 'diagram-frame';
  frame.innerHTML = `
    <div class="diagram-toolbar">
      <button type="button" class="dz-out" title="Alejar">−</button>
      <span class="dz-level">100%</span>
      <button type="button" class="dz-in" title="Acercar">+</button>
      <button type="button" class="dz-reset" title="Ajustar a la ventana">Ajustar</button>
      <button type="button" class="dz-fullscreen" title="Pantalla completa">⛶ Expandir</button>
      <span class="dz-hint">rueda = zoom · arrastrar = mover · doble clic = ajustar</span>
    </div>
    <div class="diagram-viewport">
      <div class="diagram-pan"></div>
    </div>
  `;
  frame.querySelector('.diagram-pan').innerHTML = svgMarkup;
  initDiagramZoom(frame);
  return frame;
}

function initDiagramZoom(frame) {
  const viewport = frame.querySelector('.diagram-viewport');
  const pan = frame.querySelector('.diagram-pan');
  const svg = pan.querySelector('svg');
  const level = frame.querySelector('.dz-level');
  if (!svg) return;

  // Tamaño natural del diagrama: preferimos el viewBox (no se ve afectado
  // por cómo mermaid haya seteado width/height) y si no existe, el bbox.
  let natW, natH;
  if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) {
    natW = svg.viewBox.baseVal.width;
    natH = svg.viewBox.baseVal.height;
  } else {
    const box = svg.getBBox();
    natW = box.width;
    natH = box.height;
  }
  svg.removeAttribute('height');
  svg.style.width = `${natW}px`;
  svg.style.height = 'auto';
  svg.style.display = 'block';

  const MIN_SCALE = 0.15;
  const MAX_SCALE = 8;
  const state = { scale: 1, x: 0, y: 0 };

  function apply() {
    pan.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    level.textContent = `${Math.round(state.scale * 100)}%`;
  }

  function fit() {
    const vw = Math.max(viewport.clientWidth - 24, 40);
    const vh = Math.max(viewport.clientHeight - 24, 40);
    state.scale = Math.min(vw / natW, vh / natH, 1) || 1;
    state.x = (viewport.clientWidth - natW * state.scale) / 2;
    state.y = (viewport.clientHeight - natH * state.scale) / 2;
    apply();
  }

  function zoomBy(factor, clientX, clientY) {
    const prevScale = state.scale;
    const nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, prevScale * factor));
    if (nextScale === prevScale) return;
    const rect = viewport.getBoundingClientRect();
    const px = clientX !== undefined ? clientX - rect.left : viewport.clientWidth / 2;
    const py = clientY !== undefined ? clientY - rect.top : viewport.clientHeight / 2;
    // Mantiene fijo el punto bajo el cursor mientras cambia la escala.
    state.x = px - ((px - state.x) / prevScale) * nextScale;
    state.y = py - ((py - state.y) / prevScale) * nextScale;
    state.scale = nextScale;
    apply();
  }

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
  }, { passive: false });

  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  viewport.addEventListener('pointerdown', (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    viewport.setPointerCapture(e.pointerId);
    viewport.classList.add('dragging');
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.x += e.clientX - lastX;
    state.y += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    apply();
  });
  const stopDrag = () => { dragging = false; viewport.classList.remove('dragging'); };
  viewport.addEventListener('pointerup', stopDrag);
  viewport.addEventListener('pointercancel', stopDrag);
  viewport.addEventListener('pointerleave', stopDrag);
  viewport.addEventListener('dblclick', fit);

  frame.querySelector('.dz-in').addEventListener('click', () => zoomBy(1.25));
  frame.querySelector('.dz-out').addEventListener('click', () => zoomBy(1 / 1.25));
  frame.querySelector('.dz-reset').addEventListener('click', fit);
  frame.querySelector('.dz-fullscreen').addEventListener('click', () => {
    frame.classList.toggle('fullscreen');
    requestAnimationFrame(fit);
  });

  frame.__fit = fit;
  requestAnimationFrame(fit);
}

// Esc cierra el diagrama que esté en pantalla completa (a lo sumo uno a la vez).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const fs = document.querySelector('.diagram-frame.fullscreen');
  if (!fs) return;
  fs.classList.remove('fullscreen');
  if (fs.__fit) requestAnimationFrame(fs.__fit);
});

el('search').addEventListener('input', renderTable);
el('refresh').addEventListener('click', () => {
  state.fileCache.clear();
  loadProjects().then(() => loadTasks());
});
el('project-select').addEventListener('change', (e) => selectProject(e.target.value));

callHost('meta').then((meta) => {
  el('root-path').textContent = meta.genesysDir;
}).catch(() => {});

loadProjects().then(() => {
  const requestedProject = (vscode.getState() || {}).lastProject;
  const projectId = (requestedProject && state.projects.some((p) => p.id === requestedProject))
    ? requestedProject
    : (state.projects[0] && state.projects[0].id);
  if (!projectId) return;
  selectProject(projectId);
});
