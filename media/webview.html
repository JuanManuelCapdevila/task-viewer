<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🌾 Task Guardian</title>
<script nonce="{{nonce}}" src="{{markedUri}}"></script>
<script nonce="{{nonce}}" src="{{mermaidUri}}"></script>
<style>
  /* Fuentes vendorizadas (media/vendor/fonts/): un webview no tiene por qué
     tener salida a Google Fonts (proxy corporativo, política de red del
     editor, offline) — si el @font-face falla, el <h1> cae a un fallback
     con negrita por defecto + text-shadow duro, que se ve "relleno". */
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{pixelify400Uri}}") format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url("{{pixelify500Uri}}") format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url("{{pixelify600Uri}}") format('woff2'); }
  @font-face { font-family: 'Pixelify Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url("{{pixelify700Uri}}") format('woff2'); }
  @font-face { font-family: 'Press Start 2P'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{pressStart2pUri}}") format('woff2'); }
  @font-face { font-family: 'Archivo Black'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{archivoBlackUri}}") format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{spaceGrotesk400Uri}}") format('woff2'); }
  @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: swap; src: url("{{spaceGrotesk700Uri}}") format('woff2'); }
  @font-face { font-family: 'VT323'; font-style: normal; font-weight: 400; font-display: swap; src: url("{{vt323Uri}}") format('woff2'); }
  :root {
    color-scheme: light;
    --sky-a: #ffedb0;
    --sky-b: #ffc79a;
    --grass-a: #c3e89c;
    --grass-b: #9fd977;
    --wood: #b98653;
    --wood-dark: #7d5330;
    --wood-darker: #4a2c17;
    --wood-light: #e6b781;
    --parchment: #fffbf0;
    --parchment-alt: #faedcd;
    --ink: #4a3420;
    --muted: #9c8158;
    --gold: #ffc233;
    --gold-dark: #d99e28;
    --leaf: #66bb6a;
    --leaf-dark: #3d8b41;
    --heart: #e6483f;
    --panel: var(--parchment);
    --border: var(--wood-dark);
    --text: var(--ink);
    --accent: var(--leaf-dark);
    --accent-bg: var(--parchment-alt);
    --code-bg: #f3e2bb;
    --content-font: {{contentFontFamily}};
    --heading-font: {{headingFontFamily}};
    --mono-font: {{monoFontFamily}};
    --sublabel-font: var(--mono-font);
    --heading-transform: none;
    /* Sombra dura pensada para las fuentes pixel-art (Press Start 2P /
       Pixelify Sans, con trazos gruesos donde la sombra "encaja"). Con una
       fuente fina (serif custom, system UI) la misma sombra sin blur hace
       que el texto se vea grueso/relleno — por eso extension.js la apaga
       (--heading-shadow/--chip-shadow: none) apenas el usuario elige una
       tipografía que no sea la del preset 'pixel'. */
    --heading-shadow: {{headingShadow}};
    --chip-shadow: {{chipShadow}};

    /* ---- variables "estructurales": lo que distingue la piel pixel-art
       de otras pieles (neo-retro, etc.) más allá de la paleta de color.
       Cada tema redefine este bloque completo bajo un selector de body. ---- */
    --bar-bg: linear-gradient(180deg, var(--wood-light), var(--wood));
    --frame-notch: 12px;
    --frame-border: 4px;
    --frame-clip: polygon(
      0 var(--frame-notch), var(--frame-notch) var(--frame-notch), var(--frame-notch) 0,
      calc(100% - var(--frame-notch)) 0, calc(100% - var(--frame-notch)) var(--frame-notch), 100% var(--frame-notch),
      100% calc(100% - var(--frame-notch)), calc(100% - var(--frame-notch)) calc(100% - var(--frame-notch)), calc(100% - var(--frame-notch)) 100%,
      var(--frame-notch) 100%, var(--frame-notch) calc(100% - var(--frame-notch)), 0 calc(100% - var(--frame-notch))
    );
    --frame-shadow: 0 10px 0 rgba(0, 0, 0, .28), 0 14px 18px rgba(0, 0, 0, .35);
    --btn-shadow: inset 1px 1px 0 rgba(255, 255, 255, .35), inset -2px -2px 0 rgba(0, 0, 0, .25), 0 3px 0 var(--wood-darker);
    --btn-shadow-active: inset 1px 1px 0 rgba(255, 255, 255, .35), inset -2px -2px 0 rgba(0, 0, 0, .25), 0 0 0 var(--wood-darker);
    --btn-active-transform: translateY(3px);
    --page-bg-color: transparent;
    --page-bg-image: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 42%, var(--grass-b) 42%, var(--grass-a) 100%);
    --page-bg-size: auto;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    font-family: var(--content-font);
    font-size: 15px;
    background-color: var(--page-bg-color);
    background-image: var(--page-bg-image);
    background-size: var(--page-bg-size);
    background-attachment: fixed;
    color: var(--text);
  }

  /* ---------- marco general tipo "consola / cofre" (pixel) o panel recto (neo-retro) ---------- */
  .game-frame {
    position: relative;
    height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    background: var(--wood-dark);
    padding: 6px;
    box-shadow: var(--frame-shadow);
    clip-path: var(--frame-clip);
  }
  /* Borde sólido detrás del marco: el box-shadow no sirve para esto porque
     clip-path recorta también la sombra, y como el spread es un rectángulo
     uniforme se corta justo en la diagonal de cada esquina recortada,
     dejando huecos donde se cuela el fondo. Esta capa dibuja la misma forma
     agrandada --frame-border en cada lado, así el borde queda sólido en
     toda la silueta, incluidas las esquinas. */
  .game-frame::before {
    content: '';
    position: absolute;
    inset: calc(var(--frame-border) * -1);
    background: var(--wood-darker);
    clip-path: polygon(
      0 calc(var(--frame-notch) + var(--frame-border)), calc(var(--frame-notch) + var(--frame-border)) calc(var(--frame-notch) + var(--frame-border)), calc(var(--frame-notch) + var(--frame-border)) 0,
      calc(100% - var(--frame-notch) - var(--frame-border)) 0, calc(100% - var(--frame-notch) - var(--frame-border)) calc(var(--frame-notch) + var(--frame-border)), 100% calc(var(--frame-notch) + var(--frame-border)),
      100% calc(100% - var(--frame-notch) - var(--frame-border)), calc(100% - var(--frame-notch) - var(--frame-border)) calc(100% - var(--frame-notch) - var(--frame-border)), calc(100% - var(--frame-notch) - var(--frame-border)) 100%,
      calc(var(--frame-notch) + var(--frame-border)) 100%, calc(var(--frame-notch) + var(--frame-border)) calc(100% - var(--frame-notch) - var(--frame-border)), 0 calc(100% - var(--frame-notch) - var(--frame-border))
    );
    z-index: -1;
  }
  body.theme-neo-retro .game-frame::before { content: none; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex: 0 0 auto;
    padding: 14px 20px;
    background: var(--bar-bg);
    border-bottom: 4px solid var(--wood-darker);
  }
  header h1 {
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    color: var(--parchment);
    text-shadow: var(--heading-shadow);
    letter-spacing: 0.5px;
  }
  header h1 .sprout { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-6deg); }
  }
  header .path {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    color: var(--parchment);
    opacity: .75;
    font-size: 11px;
    font-family: monospace;
    margin-top: 4px;
  }
  header .path #root-path.unset { font-style: italic; }
  header .subtitle {
    font-family: var(--sublabel-font);
    font-size: 11px;
    color: var(--parchment);
    opacity: .85;
    letter-spacing: .5px;
  }
  .toolbar { display: flex; gap: 10px; align-items: center; }
  .stat-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    background: var(--wood-darker);
    color: var(--gold);
    border: 2px solid var(--wood-darker);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .12);
    font-size: 12px;
    white-space: nowrap;
  }

  select#project-select {
    padding: 8px 10px;
    border: 2px solid var(--wood-darker);
    background: var(--parchment);
    color: var(--ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    max-width: 200px;
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .18);
  }
  select#project-select:focus {
    outline: none;
    box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .18), 0 0 0 2px var(--gold);
  }

  button {
    padding: 8px 14px;
    border: 2px solid var(--wood-darker);
    background: var(--bar-bg);
    color: var(--parchment);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    box-shadow: var(--btn-shadow);
    text-shadow: var(--chip-shadow);
    transition: transform .05s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active {
    transform: var(--btn-active-transform);
    box-shadow: var(--btn-shadow-active);
  }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-rows: auto auto 1fr;
    background: var(--parchment);
    overflow: hidden;
  }

  /* Barra para plegar el listado y darle todo el alto al documento. Resetea
     el `button` de la toolbar: es un control de layout, no una acción. */
  .table-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 12px;
    border: none;
    border-bottom: 2px solid var(--wood-dark);
    background: var(--parchment-alt);
    color: var(--muted);
    box-shadow: none;
    text-shadow: none;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    text-align: left;
    cursor: pointer;
  }
  .table-toggle:hover { filter: none; background: var(--accent-bg); color: var(--ink); }
  .table-toggle:active { transform: none; box-shadow: none; }
  .table-toggle .caret { font-size: 10px; transition: transform .15s ease; }
  /* min-width:0 + ellipsis: plegado el label lleva el título de la task
     abierta, que puede ser largo. */
  .table-toggle .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.tasks-collapsed .table-toggle .caret { transform: rotate(-90deg); }
  body.tasks-collapsed .table-wrap { display: none; }

  .table-wrap { overflow: auto; border-bottom: 4px solid var(--wood-dark); max-height: 42vh; background: var(--parchment); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0;
    text-align: left;
    background: var(--bar-bg);
    color: var(--parchment);
    padding: 9px 12px;
    border-bottom: 3px solid var(--wood-darker);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
    text-shadow: var(--chip-shadow);
  }
  tbody td {
    padding: 9px 12px;
    border-bottom: 2px dashed var(--parchment-alt);
    vertical-align: middle;
    color: var(--ink);
  }
  tbody tr { cursor: pointer; background: var(--parchment); transition: transform .05s ease; }
  tbody tr:nth-child(even) { background: var(--parchment-alt); }
  tbody tr:hover { background: var(--accent-bg); box-shadow: inset 0 0 0 2px var(--gold); }
  tbody tr.selected {
    background: var(--accent-bg);
    box-shadow: inset 0 0 0 2px var(--gold), inset 0 0 0 4px var(--wood-darker);
  }
  tbody tr.selected td:first-child::before { content: '▶ '; color: var(--gold-dark); }

  /* VS Code inyecta en cada webview un `@layer vscode-default` con, entre
     otras, `code { color; background-color; padding; border-radius }`
     resueltas contra el tema del *editor*. Al vivir en una cascade layer,
     cualquier regla nuestra sin capa le gana — pero solo en las propiedades
     que declaremos explícitamente. Declarando únicamente font-family, el
     resto se colaba: con un tema de editor oscuro, el <code> del id de cada
     task quedaba como un bloque negro sobre el fondo claro del visor.
     Mismo motivo para fijar el color de los links. */
  code {
    font-family: var(--mono-font);
    color: inherit;
    background: none;
    padding: 0;
    border-radius: 0;
  }
  a, a code { color: var(--accent); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    background: var(--wood-darker);
    color: var(--gold);
    border: 1px solid var(--wood-darker);
  }

  .gem {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    font-size: 14px;
    background: var(--wood-darker);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08);
    filter: grayscale(1);
    opacity: .35;
  }
  .gem.lit {
    filter: grayscale(0) saturate(1.4);
    opacity: 1;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08), 0 0 8px var(--gold);
  }

  .empty { padding: 32px; color: var(--muted); text-align: center; font-size: 13px; }
  .empty::before { content: '🪹'; display: block; font-size: 30px; margin-bottom: 8px; }

  .viewer { display: flex; flex-direction: column; overflow: hidden; }
  .tabs {
    display: flex; gap: 4px; padding: 10px 12px 0;
    border-bottom: 4px solid var(--wood-dark);
    overflow-x: auto;
    background: var(--parchment-alt);
  }
  .tab {
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    border: 2px solid var(--wood-darker);
    border-bottom: none;
    background: var(--wood);
    color: var(--parchment);
    cursor: pointer;
    white-space: nowrap;
    text-shadow: var(--chip-shadow);
    transform: translateY(2px);
  }
  .tab:hover { filter: brightness(1.12); }
  .tab.active {
    background: var(--parchment);
    color: var(--ink);
    text-shadow: none;
    border-color: var(--gold-dark);
    border-bottom-color: var(--parchment);
    transform: translateY(0);
  }
  .doc {
    flex: 1;
    overflow: auto;
    padding: 26px 34px;
    background: var(--parchment);
    background-image:
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .015) 0 2px, transparent 2px 4px);
  }
  .doc-inner { max-width: 900px; margin: 0 auto; line-height: 1.65; }
  .doc-inner h1 {
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 16px;
    line-height: 1.6;
    border-bottom: 3px dashed var(--gold-dark);
    padding-bottom: 10px;
  }
  .doc-inner h2 {
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 17px;
    margin-top: 30px;
    color: var(--wood-dark);
    border-left: 6px solid var(--gold);
    padding-left: 10px;
  }
  .doc-inner h3 { font-family: var(--heading-font); font-size: 14.5px; color: var(--leaf-dark); }
  .doc-inner code { background: var(--code-bg); padding: 1px 5px; font-size: 0.9em; border: 1px solid var(--wood-dark); }
  .doc-inner pre { background: var(--code-bg); padding: 12px 14px; border: 2px solid var(--wood-dark); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .1); overflow-x: auto; }
  .doc-inner pre code { background: none; padding: 0; border: none; }
  .doc-inner table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 13px; }
  .doc-inner th, .doc-inner td { border: 2px solid var(--wood-dark); padding: 7px 10px; text-align: left; }
  .doc-inner th { background: var(--parchment-alt); }
  .doc-inner blockquote {
    border-left: 4px solid var(--gold);
    background: var(--parchment-alt);
    margin: 0;
    padding: 8px 14px;
    color: var(--muted);
  }
  .doc-inner li.task-list-item { list-style: none; margin-left: -22px; }
  .doc-inner li.task-list-item input[type="checkbox"] {
    width: 15px;
    height: 15px;
    margin-right: 6px;
    accent-color: var(--leaf-dark);
    cursor: pointer;
    vertical-align: middle;
  }
  .doc-inner li.task-list-item input[type="checkbox"]:disabled { cursor: wait; opacity: .5; }
  .doc-inner .other-editable {
    display: inline-block;
    min-width: 140px;
    padding: 0 3px;
    border-bottom: 1px dashed var(--muted);
    cursor: text;
    outline: none;
  }
  /* El `______` de la plantilla se muestra como placeholder y no como texto
     real, así se puede tipear directo sin tener que borrarlo primero. */
  .doc-inner .other-editable:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    opacity: .75;
  }
  .doc-inner .other-editable:hover { border-bottom-color: var(--gold-dark); }
  .doc-inner .other-editable:focus { border-bottom: 1px solid var(--leaf-dark); background: var(--accent-bg); }
  .doc-inner .other-editable.saving { opacity: .6; }

  /* ---------------------------------------------------------------------
     Tablero de status.md (plantilla de la skill simple-spec-builder): las
     5 etapas como stepper y la tabla de specs como fichas de estado. Todo
     se expresa con las variables del tema, así que las tres pieles
     (pixel / neo-retro / clean) lo heredan sin reglas propias.
     --------------------------------------------------------------------- */
  .status-panel { margin: 0 0 26px; border: 2px solid var(--wood-dark); background: var(--panel); }
  .status-section + .status-section { border-top: 2px solid var(--wood-dark); }
  .status-section { padding: 14px 16px; }
  .status-panel > .status-section > h3 {
    margin: 0 0 12px;
    font-family: var(--heading-font);
    text-transform: var(--heading-transform);
    font-size: 12px;
    letter-spacing: .06em;
    color: var(--muted);
  }

  .status-meter { display: flex; align-items: center; gap: 12px; }
  .status-meter .status-pct {
    font-family: var(--mono-font);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    min-width: 62px;
    color: var(--accent);
  }
  .status-track { flex: 1; height: 14px; background: var(--code-bg); border: 2px solid var(--wood-dark); }
  /* display:block explícito: .status-track es flex *item* pero no flex
     container, así que su hijo <span> seguiría siendo inline e ignoraría
     el height/width que le da el relleno de la barra. */
  .status-fill { display: block; height: 100%; background: var(--leaf); transition: width .25s ease; }
  .status-panel.is-complete .status-fill { background: var(--leaf-dark); }

  .status-stage { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; }
  .status-stage + .status-stage { border-top: 1px dashed var(--parchment-alt); }
  .status-stage .mark {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-family: var(--mono-font);
    border: 2px solid var(--wood-dark);
    background: var(--code-bg);
    color: var(--muted);
  }
  .status-stage.is-done .mark { background: var(--leaf); border-color: var(--leaf-dark); color: var(--parchment); }
  .status-stage.is-current .mark { background: var(--gold); border-color: var(--gold-dark); color: var(--ink); }
  .status-stage .body { flex: 1; min-width: 0; }
  .status-stage .name { display: block; font-weight: 700; font-size: 13.5px; }
  .status-stage.is-todo .name { color: var(--muted); font-weight: 600; }
  .status-stage .note { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .status-stage .note code { font-size: .92em; }
  .status-panel .tally {
    flex: 0 0 auto;
    font-family: var(--mono-font);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    padding: 1px 8px;
    border: 2px solid var(--wood-dark);
    background: var(--code-bg);
  }

  .status-spec { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; }
  .status-spec + .status-spec { border-top: 1px dashed var(--parchment-alt); }
  .status-spec .num {
    flex: 0 0 auto;
    font-family: var(--mono-font);
    font-size: 12px;
    padding: 1px 7px;
    border: 2px solid var(--wood-dark);
    background: var(--code-bg);
  }
  .status-spec .name { flex: 1; min-width: 0; font-size: 13.5px; word-break: break-word; }
  .status-spec .state {
    flex: 0 0 auto;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 9px;
    border: 2px solid var(--wood-dark);
    white-space: nowrap;
  }
  .status-spec.is-done .state { background: var(--leaf); border-color: var(--leaf-dark); color: var(--parchment); }
  .status-spec.is-wip .state { background: var(--gold); border-color: var(--gold-dark); color: var(--ink); }
  .status-spec.is-todo .state { background: var(--code-bg); color: var(--muted); }
  .status-spec.is-todo .name { color: var(--muted); }

  body.theme-clean .status-panel { border: 1px solid var(--wood-dark); }
  body.theme-clean .status-section + .status-section { border-top: 1px solid var(--wood-dark); }
  body.theme-clean .status-track,
  body.theme-clean .status-stage .mark,
  body.theme-clean .status-panel .tally,
  body.theme-clean .status-spec .num,
  body.theme-clean .status-spec .state { border-width: 1px; }

  .save-toast {
    position: fixed;
    bottom: 18px;
    right: 18px;
    padding: 8px 14px;
    background: var(--wood-darker);
    color: var(--gold);
    border: 2px solid var(--wood-dark);
    font-size: 12px;
    box-shadow: 0 3px 0 var(--wood-darker);
    z-index: 2000;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .15s ease, transform .15s ease;
    pointer-events: none;
  }
  .save-toast.show { opacity: 1; transform: translateY(0); }
  .save-toast.error { color: var(--heart); border-color: var(--heart); }
  .doc-inner pre.mermaid { background: var(--panel); text-align: center; }
  .mermaid-error { color: var(--heart); font-size: 12.5px; text-align: left; background: var(--code-bg); padding: 10px 12px; border: 2px solid var(--heart); }
  .placeholder { color: var(--muted); text-align: center; padding: 70px 20px; font-size: 13px; }
  .placeholder::before { content: '🧭'; display: block; font-size: 34px; margin-bottom: 10px; }

  .diagram-frame {
    display: flex;
    flex-direction: column;
    border: 3px solid var(--wood-dark);
    box-shadow: 0 4px 0 var(--wood-darker);
    margin: 18px 0;
    background: var(--panel);
  }
  .diagram-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-bottom: 3px solid var(--wood-dark);
    background: var(--bar-bg);
  }
  .diagram-toolbar button {
    padding: 3px 10px;
    font-size: 13px;
    line-height: 1.3;
  }
  .diagram-toolbar .dz-level {
    font-size: 12px;
    color: var(--parchment);
    text-shadow: var(--chip-shadow);
    min-width: 44px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .diagram-toolbar .dz-hint {
    margin-left: auto;
    font-size: 11px;
    color: var(--parchment);
    opacity: .8;
  }
  .diagram-viewport {
    position: relative;
    overflow: hidden;
    height: min(65vh, 620px);
    cursor: grab;
    touch-action: none;
    background: var(--panel);
  }
  .diagram-viewport.dragging { cursor: grabbing; }
  .diagram-pan {
    position: absolute;
    top: 0;
    left: 0;
    width: max-content;
    transform-origin: 0 0;
  }
  .diagram-pan svg { display: block; }
  .diagram-frame.fullscreen {
    position: fixed;
    inset: 14px;
    z-index: 1000;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
  }
  .diagram-frame.fullscreen .diagram-viewport { height: auto; flex: 1; }

  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track { background: var(--parchment-alt); }
  ::-webkit-scrollbar-thumb { background: var(--wood); border: 3px solid var(--parchment-alt); }
  ::-webkit-scrollbar-thumb:hover { background: var(--wood-dark); }

  /* ---------------------------------------------------------------------
     Tema "Neo-Retro Dev Deck" (design_1.md): paleta R2-D2, sin gradientes,
     bordes negros gruesos, sombras duras sin blur, esquinas rectas, grid
     de cuaderno de ingeniería de fondo. Redefine únicamente las variables
     de :root — el resto de las reglas ya está escrito en términos de esas
     variables, así que no hace falta tocar los selectores de componentes.
     --------------------------------------------------------------------- */
  body.theme-neo-retro {
    --wood: #a8a8a8;
    --wood-dark: #005596;
    --wood-darker: #000000;
    --wood-light: #3d84c4;
    --parchment: #ffffff;
    --parchment-alt: #f1f1ee;
    --ink: #000000;
    --muted: #6b6b6b;
    --gold: #e11927;
    --gold-dark: #b8121e;
    --leaf: #005596;
    --leaf-dark: #005596;
    --heart: #e11927;
    --code-bg: #f1f1ee;
    --text: var(--ink);
    --panel: var(--parchment);
    --accent: var(--leaf-dark);
    --accent-bg: var(--parchment-alt);

    --bar-bg: var(--wood-dark);
    --frame-clip: none;
    --frame-shadow: 8px 8px 0 var(--wood-darker);
    --btn-shadow: 4px 4px 0 var(--wood-darker);
    --btn-shadow-active: 2px 2px 0 var(--wood-darker);
    --btn-active-transform: translate(2px, 2px);
    --page-bg-color: #fdfbf7;
    --page-bg-image:
      linear-gradient(rgba(0, 0, 0, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 0, 0, .05) 1px, transparent 1px);
    --page-bg-size: 40px 40px;
    --heading-transform: uppercase;
    --heading-shadow: none;
    --chip-shadow: none;
  }
  /* El marco pixel usa .game-frame como "borde" de color sólido (padding +
     background); en neo-retro ese mismo elemento pasa a ser un panel recto
     con sombra dura — clip-path: none ya lo deja rectangular. */
  body.theme-neo-retro .game-frame { padding: 4px; }

  /* ---------------------------------------------------------------------
     Tema "Clean": sin textura, sin sombras duras, sin degradés, sin
     esquinas recortadas ni marcos decorativos. Solo redefinir las
     variables de :root no alcanza acá porque varios componentes traen
     sombras/bordes/dashed-lines "a mano" (no expresados como variable) —
     este bloque los neutraliza explícitamente, además de ocultar los
     elementos puramente decorativos (.deco, animación del brote, marcador
     ▶ de fila seleccionada, iconos de estado vacío).
     --------------------------------------------------------------------- */
  body.theme-clean {
    --wood: #f6f8fa;
    --wood-dark: #d0d7de;
    --wood-darker: #24292f;
    --wood-light: #ffffff;
    --parchment: #ffffff;
    --parchment-alt: #f6f8fa;
    --ink: #1f2328;
    --muted: #6e7781;
    --gold: #0969da;
    --gold-dark: #0757ba;
    --leaf: #0969da;
    --leaf-dark: #0757ba;
    --heart: #cf222e;
    --code-bg: #f6f8fa;
    --text: var(--ink);
    --panel: var(--parchment);
    --accent: var(--leaf-dark);
    --accent-bg: var(--parchment-alt);

    --bar-bg: #ffffff;
    --frame-notch: 0px;
    --frame-border: 0px;
    --frame-clip: none;
    --frame-shadow: none;
    --btn-shadow: none;
    --btn-shadow-active: none;
    --btn-active-transform: none;
    --page-bg-color: #ffffff;
    --page-bg-image: none;
    --page-bg-size: auto;
  }
  body.theme-clean .game-frame { padding: 0; border: 1px solid var(--wood-dark); }
  body.theme-clean .game-frame::before { content: none; }
  body.theme-clean header { border-bottom: 1px solid var(--wood-dark); }
  body.theme-clean header h1,
  body.theme-clean header .path,
  body.theme-clean header .subtitle { color: var(--ink); opacity: 1; }
  body.theme-clean .deco { display: none; }
  body.theme-clean .sprout { animation: none; }
  body.theme-clean .stat-chip {
    background: var(--parchment-alt);
    color: var(--ink);
    border: 1px solid var(--wood-dark);
    box-shadow: none;
  }
  body.theme-clean select#project-select {
    border: 1px solid var(--wood-dark);
    box-shadow: none;
  }
  body.theme-clean select#project-select:focus {
    box-shadow: 0 0 0 2px rgba(9, 105, 218, .3);
  }
  body.theme-clean button {
    border: 1px solid var(--wood-dark);
    background: var(--parchment-alt);
    color: var(--ink);
  }
  body.theme-clean button:hover { filter: none; background: var(--wood-dark); }
  /* `body.theme-clean button` gana en especificidad y en orden al reset de
     .table-toggle, así que la barra necesita su propia regla en el tema. */
  body.theme-clean .table-toggle {
    border: none;
    border-bottom: 1px solid var(--wood-dark);
    background: var(--parchment-alt);
    color: var(--muted);
  }
  body.theme-clean .table-toggle:hover { background: var(--accent-bg); color: var(--ink); }
  body.theme-clean thead th {
    background: var(--parchment-alt);
    color: var(--ink);
    border-bottom: 1px solid var(--wood-dark);
    text-transform: none;
    letter-spacing: normal;
    text-shadow: none;
  }
  body.theme-clean tbody td { border-bottom: 1px solid var(--parchment-alt); }
  body.theme-clean tbody tr:hover { box-shadow: none; background: var(--parchment-alt); }
  body.theme-clean tbody tr.selected {
    background: var(--accent-bg);
    box-shadow: inset 2px 0 0 var(--gold);
  }
  body.theme-clean tbody tr.selected td:first-child::before { content: none; }
  body.theme-clean .badge, body.theme-clean .gem {
    background: var(--parchment-alt);
    color: var(--ink);
    border: 1px solid var(--wood-dark);
    box-shadow: none;
  }
  body.theme-clean .gem.lit { box-shadow: none; opacity: 1; }
  body.theme-clean .empty::before, body.theme-clean .placeholder::before { display: none; }
  body.theme-clean .tabs { border-bottom: 1px solid var(--wood-dark); background: var(--parchment); }
  body.theme-clean .tab {
    border: 1px solid var(--wood-dark);
    border-bottom: none;
    background: var(--parchment-alt);
    color: var(--ink);
    text-shadow: none;
  }
  body.theme-clean .tab:hover { filter: none; background: var(--wood-dark); }
  body.theme-clean .tab.active { background: var(--parchment); border-color: var(--gold); }
  body.theme-clean .doc { background-image: none; }
  body.theme-clean .doc-inner h1 { border-bottom: 1px solid var(--wood-dark); }
  body.theme-clean .doc-inner h2 { border-left: 3px solid var(--gold); }
  body.theme-clean .doc-inner code { border: 1px solid var(--wood-dark); }
  body.theme-clean .doc-inner pre { border: 1px solid var(--wood-dark); box-shadow: none; }
  body.theme-clean .doc-inner th, body.theme-clean .doc-inner td { border: 1px solid var(--wood-dark); }
  body.theme-clean .save-toast { box-shadow: none; border: 1px solid var(--wood-dark); }
  body.theme-clean .diagram-frame { border: 1px solid var(--wood-dark); box-shadow: none; }
  body.theme-clean .diagram-toolbar { border-bottom: 1px solid var(--wood-dark); }
  body.theme-clean .diagram-toolbar .dz-level,
  body.theme-clean .diagram-toolbar .dz-hint { color: var(--ink); text-shadow: none; }
  body.theme-clean ::-webkit-scrollbar { width: 10px; height: 10px; }
  body.theme-clean ::-webkit-scrollbar-thumb { background: var(--wood-dark); border: 2px solid var(--parchment); }
  body.theme-clean ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* "cambiar" es una acción secundaria y va como link, no como botón de
     toolbar. Va al final del
     stylesheet a propósito: `button` y `body.theme-clean button` lo pisarían
     parcialmente si estuviera arriba, y así el reset gana en los tres temas
     por orden además de por especificidad. */
  header .path #change-root {
    padding: 0;
    border: 0;
    background: none;
    box-shadow: none;
    text-shadow: none;
    color: inherit;
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  header .path #change-root:hover { filter: none; background: none; opacity: .7; }
  header .path #change-root:active { transform: none; box-shadow: none; }

  /* ---------------------------------------------------------------------
     Layout angosto (panel de la activity bar)
     El visor nació para la pestaña ancha, donde una tabla de 6 columnas
     entra cómoda. En el sidebar mide ~350px: el header desbordaba en
     horizontal (select 200px + chip, con tamaño fijo y nowrap) y la tabla
     quedaba con las celdas partidas en cinco renglones cada una. Acá la
     tabla pasa a fichas apiladas y todo lo de ancho fijo pasa a flexible.
     Va al final del stylesheet porque un @media no aporta especificidad:
     tiene que ganar por orden.
     --------------------------------------------------------------------- */
  @media (max-width: 760px) {
    body { padding: 8px; }
    .game-frame { height: calc(100vh - 16px); padding: 4px; }

    header { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 14px; }
    header > div { min-width: 0; }
    header h1 { font-size: 13px; }
    /* Las rutas largas no tienen espacios donde cortar. */
    header .path #root-path { overflow-wrap: anywhere; }

    .toolbar { flex-wrap: wrap; gap: 8px; }
    /* El select se estira con el ancho disponible; el chip conserva el suyo
       y cae al renglón siguiente si no entra. */
    select#project-select { flex: 1 1 130px; max-width: none; min-width: 0; }

    /* Tabla -> fichas: el thead se va y cada <tr> se reordena en grid,
       con el id y el título a ancho completo y los indicadores en una
       línea de metadatos abajo. */
    .table-wrap { max-height: 38vh; }
    table, tbody { display: block; }
    thead { display: none; }
    tbody tr {
      display: grid;
      grid-template-columns: auto auto auto 1fr;
      grid-template-areas:
        "id    id  id   id"
        "title title title title"
        "specs oq  diag date";
      align-items: center;
      gap: 6px 8px;
      padding: 10px 12px;
      border-bottom: 2px dashed var(--parchment-alt);
    }
    tbody td { padding: 0; border: none; }
    tbody td:nth-child(1) { grid-area: id; font-size: 12px; }
    tbody td:nth-child(2) { grid-area: title; font-weight: 600; line-height: 1.35; }
    tbody td:nth-child(3) { grid-area: specs; }
    tbody td:nth-child(4) { grid-area: oq; }
    tbody td:nth-child(5) { grid-area: diag; }
    tbody td:nth-child(6) { grid-area: date; justify-self: end; font-size: 11px; color: var(--muted); }
    .gem { width: 22px; height: 22px; font-size: 12px; }

    /* Con pocas solapas entran en dos renglones y se ven todas; scrollear
       en horizontal para descubrir que había una "Diagramas" no se ve. */
    .tabs { flex-wrap: wrap; overflow-x: visible; row-gap: 4px; padding: 8px 10px 0; }
    .tab { padding: 6px 10px; font-size: 11px; }

    .doc { padding: 16px 14px; }
    .empty { padding: 22px 16px; }
    .placeholder { padding: 40px 16px; }

    .status-section { padding: 12px 12px; }
    .status-meter .status-pct { font-size: 17px; min-width: 50px; }
    /* El nombre de la spec puede ser largo; el estado se va a su renglón
       en vez de exprimir el nombre a una palabra por línea. */
    .status-spec { flex-wrap: wrap; gap: 6px 8px; }
    .status-spec .name { flex: 1 1 100%; order: 3; }

    /* Las tablas del markdown no se pueden reflowear sin romper la lectura:
       scrollean solas en vez de estirar el documento. */
    .doc-inner table { display: block; overflow-x: auto; }
  }

  /* Sidebar realmente angosto: ya no entran tres indicadores más la fecha
     en un renglón, así que la fecha se va sola abajo. */
  @media (max-width: 420px) {
    header h1 { font-size: 11px; }
    tbody tr {
      grid-template-columns: auto auto 1fr;
      grid-template-areas:
        "id    id   id"
        "title title title"
        "specs oq   diag"
        "date  date date";
    }
    tbody td:nth-child(6) { justify-self: start; }
    .doc { padding: 14px 10px; }
  }
</style>
</head>
<body class="{{themeClass}}">
<div class="game-frame">
<header>
  <div>
    <h1><span class="sprout deco">🌾</span> Task Guardian</h1>
    <div class="subtitle">task-viewer</div>
    <div class="path"><span id="root-path"></span><button type="button" id="change-root" title="Elegir otra carpeta raíz">cambiar</button></div>
  </div>
  <div class="toolbar">
    <select id="project-select"></select>
    <span class="stat-chip"><span class="deco">📋</span> <span id="task-count">0</span> quests</span>
  </div>
</header>
<main>
  <button type="button" class="table-toggle" id="toggle-table" aria-expanded="true" aria-controls="table-wrap">
    <span class="caret" aria-hidden="true">▾</span>
    <span class="label" id="toggle-label">Tasks</span>
  </button>
  <div class="table-wrap" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th>Título</th>
          <th>Specs</th>
          <th><span class="deco">❓</span> Open Q.</th>
          <th><span class="deco">🗺️</span> Diagramas</th>
          <th>Última actualización</th>
        </tr>
      </thead>
      <tbody id="task-rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" hidden>No hay tasks en este proyecto</div>
  </div>
  <div class="viewer">
    <div class="tabs" id="tabs"></div>
    <div class="doc" id="doc">
      <div class="placeholder">Seleccioná un task de la tabla para ver sus specs.</div>
    </div>
  </div>
</main>
</div>
<div class="save-toast" id="save-toast"></div>

<script nonce="{{nonce}}">
// Tema 'base' fijo (no sigue prefers-color-scheme): el panel de diagramas
// siempre es claro, así que el tema de mermaid debe serlo también o el
// contraste se rompe (p.ej. el tema 'dark' usa grises pensados para fondo
// oscuro, ilegibles sobre pergamino).
// Los colores del diagrama no pueden ser CSS vars directamente (mermaid
// genera un <style> propio con valores ya resueltos), así que se leen los
// custom properties del tema activo en runtime y se traducen a hex/rgb acá.
// Así el mismo bloque sirve para 'pixel' y 'neo-retro' sin duplicar mermaid.initialize.
function cssVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  securityLevel: 'loose',
  // htmlLabels: los nodos se miden como <div> real (foreignObject) en vez de
  // con la heurística de ancho de <text> de mermaid, que con una fuente
  // pixel de métricas atípicas subestima el alto necesario y recorta la
  // segunda línea de las etiquetas largas.
  flowchart: { htmlLabels: true },
  themeVariables: {
    fontFamily: 'var(--content-font)',
    background: cssVar('--parchment'),
    primaryColor: cssVar('--parchment-alt'),
    primaryBorderColor: cssVar('--wood-dark'),
    primaryTextColor: cssVar('--ink'),
    secondaryColor: cssVar('--code-bg'),
    tertiaryColor: cssVar('--parchment'),
    lineColor: cssVar('--wood-dark'),
    textColor: cssVar('--ink'),
    mainBkg: cssVar('--parchment-alt'),
    actorBkg: cssVar('--parchment-alt'),
    actorBorder: cssVar('--wood-dark'),
    actorTextColor: cssVar('--ink'),
    actorLineColor: cssVar('--wood-dark'),
    signalColor: cssVar('--ink'),
    signalTextColor: cssVar('--ink'),
    labelBoxBkgColor: cssVar('--parchment-alt'),
    labelBoxBorderColor: cssVar('--wood-dark'),
    labelTextColor: cssVar('--ink'),
    loopTextColor: cssVar('--ink'),
    noteBkgColor: cssVar('--code-bg'),
    noteBorderColor: cssVar('--gold-dark'),
    noteTextColor: cssVar('--ink'),
    activationBkgColor: cssVar('--code-bg'),
    activationBorderColor: cssVar('--wood-dark'),
    sequenceNumberColor: cssVar('--parchment'),
    edgeLabelBackground: cssVar('--parchment'),
    clusterBkg: cssVar('--code-bg'),
    clusterBorder: cssVar('--wood-dark')
  }
});

// --- Puente con el extension host: reemplaza los fetch() de la versión
// standalone por mensajes postMessage/onDidReceiveMessage, correlacionados
// por un id de request. El host (extension.js) resuelve cada 'type' contra
// lib/core.js y responde con el mismo id.
const vscode = acquireVsCodeApi();
let reqSeq = 0;
const pending = new Map();
window.addEventListener('message', (event) => {
  const msg = event.data;
  if (!msg) return;
  // Mensajes empujados por la extensión (sin id): no responden a ningún
  // callHost pendiente. Hoy solo el aviso de que cambió la carpeta raíz,
  // que llega también cuando el cambio se hizo desde settings.json o desde
  // otra ventana de VS Code.
  if (!msg.id && msg.type === 'rootChanged') {
    setRootLabel(msg.genesysDir);
    loadRoot();
    return;
  }
  // Cambió algún .md de la carpeta de la task abierta. Llega con project/task
  // para descartar avisos de un watcher viejo que todavía no se apagó.
  if (!msg.id && msg.type === 'taskChanged') {
    if (msg.project === state.selectedProject && msg.task === state.selectedId) refreshOpenTask();
    return;
  }
  if (!msg.id || !pending.has(msg.id)) return;
  const { resolve, reject } = pending.get(msg.id);
  pending.delete(msg.id);
  if (msg.error) reject(new Error(msg.error));
  else resolve(msg.result);
});
function callHost(type, payload) {
  const id = `r${++reqSeq}`;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    vscode.postMessage({ id, type, payload });
  });
}

const LAST_PROJECT_KEY = 'task-viewer:last-project';
// docStale: el documento en pantalla quedó atrás respecto del disco porque el
// refresh automático se difirió (ver refreshOpenTask). Mientras esté en true no
// se guarda desde el documento: ver persist() en wireInteractiveFields.
const state = { genesysDir: null, projects: [], selectedProject: null, tasks: [], selectedId: null, selectedFile: null, fileCache: new Map(), docStale: false };

const el = (id) => document.getElementById(id);

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function tabLabel(file, task) {
  const clean = document.body.classList.contains('theme-clean');
  if (file.kind === 'status') return clean ? 'Status' : '📊 Status';
  if (file.kind === 'index') return clean ? 'Índice' : '📖 Índice';
  if (file.kind === 'open-questions') return clean ? 'Open Questions' : '❓ Open Questions';
  if (file.kind === 'plan') return clean ? 'Plan' : '🧭 Plan';
  if (file.kind === 'diagrams') return clean ? 'Diagramas' : '🗺️ Diagramas';
  if (file.kind === 'spec') {
    const m = file.name.match(/^spec-(\d+)-(.+)\.md$/);
    if (m) return `${clean ? '' : '📜 '}Spec ${m[1]} — ${m[2].replace(/-/g, ' ')}`;
  }
  return file.name;
}

async function loadProjects() {
  state.projects = await callHost('projects');
  renderProjectSelect();
}

// Plegada, la barra es lo único que queda del listado: lleva el título de la
// task abierta para no perder de vista qué se está mirando.
function renderToggleLabel() {
  const collapsed = document.body.classList.contains('tasks-collapsed');
  const task = state.tasks.find((t) => t.id === state.selectedId);
  el('toggle-label').textContent = collapsed && task ? task.title : 'Tasks';
}

function setTasksCollapsed(collapsed) {
  document.body.classList.toggle('tasks-collapsed', collapsed);
  el('toggle-table').setAttribute('aria-expanded', String(!collapsed));
  vscode.setState({ ...(vscode.getState() || {}), tasksCollapsed: collapsed });
  renderToggleLabel();
}

function setRootLabel(genesysDir) {
  state.genesysDir = genesysDir || null;
  const node = el('root-path');
  node.textContent = genesysDir || 'sin carpeta raíz configurada';
  node.classList.toggle('unset', !genesysDir);
  node.title = genesysDir || '';
}

// Recarga todo lo que cuelga de la carpeta raíz. Corre al arrancar y cada vez
// que la raíz cambia; `preferredProject` solo se respeta si ese proyecto
// existe en la raíz nueva, porque al cambiar de carpeta lo normal es que no.
async function loadRoot(preferredProject) {
  state.selectedProject = null;
  state.selectedId = null;
  state.selectedFile = null;
  state.tasks = [];
  state.fileCache.clear();

  await loadProjects();
  const projectId = (preferredProject && state.projects.some((p) => p.id === preferredProject))
    ? preferredProject
    : (state.projects[0] && state.projects[0].id);
  if (projectId) return selectProject(projectId);

  // Sin proyectos no hay a quién delegarle el repintado: selectProject() es
  // el que normalmente redibuja tabla y solapas.
  syncWatch();
  renderTable();
  renderTabs();
}

function renderProjectSelect() {
  const select = el('project-select');
  select.innerHTML = '';
  state.projects.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.id} (${p.taskCount})`;
    select.appendChild(opt);
  });
  if (state.selectedProject && state.projects.some((p) => p.id === state.selectedProject)) {
    select.value = state.selectedProject;
  } else if (state.projects.length) {
    select.value = state.projects[0].id;
  }
}

async function selectProject(projectId, taskId, fileName) {
  state.selectedProject = projectId;
  state.selectedId = null;
  state.selectedFile = null;
  state.fileCache.clear();
  el('project-select').value = projectId;
  vscode.setState({ ...(vscode.getState() || {}), lastProject: projectId });

  await loadTasks();
  if (taskId && state.tasks.some((t) => t.id === taskId)) {
    selectTask(taskId, fileName);
  } else {
    syncWatch();
    renderTabs();
  }
}

async function loadTasks() {
  if (!state.selectedProject) {
    state.tasks = [];
    renderTable();
    return;
  }
  state.tasks = await callHost('tasks', { project: state.selectedProject }).catch(() => []);
  renderTable();
}

function renderTable() {
  const rows = el('task-rows');
  rows.innerHTML = '';

  el('empty-msg').textContent = !state.genesysDir
    ? 'No hay carpeta raíz: elegí con "cambiar" (arriba) la carpeta que agrupa tus proyectos con .tasks/'
    : state.projects.length
      ? 'No hay tasks en este proyecto'
      : 'No se encontraron proyectos con .tasks/ en esta carpeta';
  el('empty-msg').hidden = state.tasks.length > 0;
  el('task-count').textContent = state.tasks.length;
  renderToggleLabel();

  state.tasks.forEach((t) => {
    const tr = document.createElement('tr');
    tr.dataset.id = t.id;
    if (t.id === state.selectedId) tr.classList.add('selected');
    tr.innerHTML = `
      <td><code>${t.id}</code></td>
      <td>${t.title}</td>
      <td><span class="badge"><span class="deco">📜</span> x${t.specCount}</span></td>
      <td><span class="gem ${t.hasOpenQuestions ? 'lit' : ''}" title="${t.hasOpenQuestions ? 'Tiene preguntas abiertas' : 'Sin preguntas abiertas'}">❓</span></td>
      <td><span class="gem ${t.hasDiagrams ? 'lit' : ''}" title="${t.hasDiagrams ? 'Tiene diagramas' : 'Sin diagramas'}">🗺️</span></td>
      <td>${fmtDate(t.lastUpdated)}</td>
    `;
    tr.addEventListener('click', () => selectTask(t.id));
    rows.appendChild(tr);
  });
}

function selectTask(taskId, fileName) {
  state.selectedId = taskId;
  state.selectedFile = fileName || null;
  syncWatch();
  renderTable();
  return renderTabs();
}

// Devuelve la promesa de renderDoc() para que el auto-refresh pueda esperar a
// que el documento esté pintado antes de restaurar el scroll.
function renderTabs() {
  const task = state.tasks.find((t) => t.id === state.selectedId);
  const tabs = el('tabs');
  tabs.innerHTML = '';
  if (!task) {
    return renderDoc();
  }

  if (!state.selectedFile && task.files.length) state.selectedFile = task.files[0].name;

  task.files.forEach((file) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (file.name === state.selectedFile ? ' active' : '');
    tab.textContent = tabLabel(file, task);
    tab.addEventListener('click', () => selectTask(task.id, file.name));
    tabs.appendChild(tab);
  });

  return renderDoc();
}

async function renderDoc() {
  const doc = el('doc');
  const task = state.tasks.find((t) => t.id === state.selectedId);
  if (!task || !state.selectedFile) {
    doc.innerHTML = '<div class="placeholder">Seleccioná un task de la tabla para ver sus specs.</div>';
    return;
  }

  const project = state.selectedProject;
  const cacheKey = `${project}/${task.id}/${state.selectedFile}`;
  let content = state.fileCache.get(cacheKey);
  if (content === undefined) {
    doc.innerHTML = '<div class="placeholder">Cargando…</div>';
    try {
      const data = await callHost('file', { project, task: task.id, file: state.selectedFile });
      content = data.content ?? `Error: ${data.error || 'no se pudo cargar'}`;
    } catch (err) {
      content = `Error: ${err.message}`;
    }
    state.fileCache.set(cacheKey, content);
  }

  // Preserva bloques ```mermaid como <pre class="mermaid"> antes/en vez del
  // <pre><code class="language-mermaid"> que emite marked, para que mermaid.run
  // los detecte.
  const html = marked.parse(content, { mangle: false, headerIds: false });
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  wrapper.querySelectorAll('code.language-mermaid').forEach((codeEl) => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = codeEl.textContent;
    codeEl.parentElement.replaceWith(pre);
  });

  const selected = task.files.find((f) => f.name === state.selectedFile);
  const isStatus = selected && selected.kind === 'status';
  if (isStatus) decorateStatusDoc(wrapper, content);

  doc.innerHTML = '<div class="doc-inner"></div>';
  doc.querySelector('.doc-inner').appendChild(wrapper);
  // Lo que se acaba de pintar sale de disco (o del cache, que se invalida en
  // cada refresh), así que el buffer de edición vuelve a ser confiable.
  state.docStale = false;

  // status.md lo mantiene el agente ("do not edit manually") y además el panel
  // ya se llevó los checkboxes de las etapas, así que no hay nada que cablear.
  if (!isStatus) {
    wireInteractiveFields(doc.querySelector('.doc-inner'), project, task.id, state.selectedFile, content);
  }

  // Espera a que la fuente elegida termine de cargar: si mermaid mide el
  // texto de los nodos antes de eso, lo hace contra la fuente de fallback
  // y el tamaño de caja calculado queda corto para la fuente real.
  await document.fonts.ready.catch(() => {});

  // Se renderiza cada bloque por separado (no en batch): un diagrama con
  // error de sintaxis no debe dejar corruptos/superpuestos los demás.
  const mermaidBlocks = [...doc.querySelectorAll('.mermaid')];
  for (const block of mermaidBlocks) {
    const source = block.textContent;
    const id = `mermaid-${Math.random().toString(36).slice(2)}`;
    try {
      const { svg } = await mermaid.render(id, source);
      block.replaceWith(buildDiagramFrame(svg));
    } catch (err) {
      block.innerHTML = `<div class="mermaid-error">Error renderizando diagrama: ${err.message || err}</div>`;
      console.error('Error renderizando mermaid', err);
    } finally {
      // Cuando el parseo falla, mermaid deja su contenedor temporal `#d<id>`
      // colgado de <body> con el cartelón "Syntax error in text" adentro, y no
      // lo limpia nunca (en un render exitoso sí lo saca). Cada fallo sumaba
      // así un cartel permanente al pie de la página, ajeno al documento que
      // se esté viendo: se acumulaban sobre todo con el refresco automático,
      // que reintenta el render cada vez que cambia el archivo. El error del
      // diagrama ya se muestra en su lugar, dentro del documento.
      const orphan = document.getElementById(`d${id}`);
      if (orphan) orphan.remove();
    }
  }
}

let toastTimer = null;
function showToast(message, isError) {
  const toast = el('save-toast');
  toast.textContent = message;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

async function saveFileContent(project, taskId, fileName, content) {
  const result = await callHost('saveFile', { project, task: taskId, file: fileName, content });
  if (result.error) throw new Error(result.error);
}

// ---------------------------------------------------------------------------
// status.md (plantilla de la skill simple-spec-builder) es un tablero de avance
// de forma fija: 5 etapas en checkboxes + una tabla de specs con estado. Leído
// como markdown plano cuesta sacarle "cómo viene la task" de un vistazo, así
// que se antepone un panel con el porcentaje, el stepper de etapas y las specs
// como fichas, y se quitan del documento las dos piezas que el panel ya
// representa. Si el archivo no sigue la plantilla, no se detectan etapas y se
// cae al render markdown de siempre sin perder nada.
// ---------------------------------------------------------------------------

// Devuelve el cuerpo de la sección `## <titulo>` que matchee `re`.
function statusSection(content, re) {
  const parts = content.split(/^##\s+(.+)$/m);
  for (let i = 1; i < parts.length; i += 2) {
    if (re.test(parts[i].trim())) return parts[i + 1] || '';
  }
  return '';
}

function parseStatusStages(content) {
  const out = [];
  statusSection(content, /^(stages|etapas)/i).split('\n').forEach((line) => {
    const m = line.match(/^\s*-\s+\[([ xX])\]\s+\*\*(\d+)\.\s*(.+?)\*\*\s*(.*)$/);
    if (!m) return;
    let title = m[3].trim();
    let count = null;
    // La etapa 5 lleva el avance dentro del propio título ("Specs resueltas
    // — 2 de 2") porque admite estados parciales sin tildar el checkbox.
    const c = title.match(/^(.*?)\s*[—–-]\s*(\d+)\s+de\s+(\d+)\s*$/);
    if (c) { title = c[1].trim(); count = { done: Number(c[2]), total: Number(c[3]) }; }
    out.push({
      done: m[1].toLowerCase() === 'x',
      num: m[2],
      title,
      note: m[4].replace(/^\s*[—–-]\s*/, '').trim(),
      count
    });
  });
  return out;
}

function parseStatusSpecs(content) {
  const out = [];
  statusSection(content, /^specs/i).split('\n').forEach((line) => {
    const m = line.match(/^\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*$/);
    if (!m) return;
    const [, num, name, state] = m;
    if (/^[-:\s]+$/.test(num) || /^spec$/i.test(num)) return;
    const kind = /✅|resuelt/i.test(state) ? 'done' : (/🟨|progres/i.test(state) ? 'wip' : 'todo');
    out.push({ num, name, kind, state: state.replace(/[⬜🟨✅]/g, '').trim() || state });
  });
  return out;
}

function buildStatusPanel(stages, specs) {
  const panel = document.createElement('div');
  panel.className = 'status-panel';

  const doneCount = stages.filter((s) => s.done).length;
  const pct = Math.round((doneCount / stages.length) * 100);
  if (pct === 100) panel.classList.add('is-complete');

  const meter = document.createElement('div');
  meter.className = 'status-section';
  meter.innerHTML = `
    <div class="status-meter">
      <span class="status-pct">${pct}%</span>
      <span class="status-track"><span class="status-fill"></span></span>
      <span class="tally">${doneCount}/${stages.length} etapas</span>
    </div>
  `;
  meter.querySelector('.status-fill').style.width = `${pct}%`;
  panel.appendChild(meter);

  // La etapa "en curso" es la primera sin tildar: da el foco de lectura sin
  // que el archivo tenga que declararlo.
  const currentIdx = stages.findIndex((s) => !s.done);
  const stagesSection = document.createElement('div');
  stagesSection.className = 'status-section';
  stagesSection.innerHTML = '<h3>Etapas</h3>';
  stages.forEach((stage, i) => {
    const row = document.createElement('div');
    row.className = `status-stage ${stage.done ? 'is-done' : (i === currentIdx ? 'is-current' : 'is-todo')}`;
    row.innerHTML = `
      <span class="mark">${stage.done ? '✓' : stage.num}</span>
      <span class="body">
        <span class="name"></span>
        ${stage.note ? '<span class="note"></span>' : ''}
      </span>
      ${stage.count ? `<span class="tally">${stage.count.done}/${stage.count.total}</span>` : ''}
    `;
    row.querySelector('.name').textContent = stage.title;
    // Las notas traen markdown inline (backticks, negritas) que conviene
    // renderizar; parseInline no genera bloques, así que no rompe el layout.
    if (stage.note) row.querySelector('.note').innerHTML = marked.parseInline(stage.note);
    stagesSection.appendChild(row);
  });
  panel.appendChild(stagesSection);

  if (specs.length) {
    const specsSection = document.createElement('div');
    specsSection.className = 'status-section';
    specsSection.innerHTML = '<h3>Specs</h3>';
    specs.forEach((spec) => {
      const row = document.createElement('div');
      row.className = `status-spec is-${spec.kind}`;
      row.innerHTML = '<span class="num"></span><span class="name"></span><span class="state"></span>';
      row.querySelector('.num').textContent = spec.num;
      row.querySelector('.name').textContent = spec.name;
      row.querySelector('.state').textContent = spec.state;
      specsSection.appendChild(row);
    });
    panel.appendChild(specsSection);
  }

  return panel;
}

function decorateStatusDoc(wrapper, content) {
  const stages = parseStatusStages(content);
  if (!stages.length) return;
  const specs = parseStatusSpecs(content);

  // Se quitan del markdown las dos piezas que el panel ya muestra, más la
  // leyenda de emojis (que el panel reemplaza por color). El resto —notas de
  // spec, "Last updated"— se deja intacto.
  const stagesList = [...wrapper.querySelectorAll('ul')]
    .find((ul) => ul.querySelector('input[type="checkbox"]'));
  if (stagesList) stagesList.remove();

  const specsTable = [...wrapper.querySelectorAll('table')]
    .find((t) => /^\s*spec\b/i.test(t.querySelector('th') ? t.querySelector('th').textContent : ''));
  if (specsTable) specsTable.remove();

  [...wrapper.querySelectorAll('p')]
    .filter((p) => /^\s*(legend|leyenda)\s*:/i.test(p.textContent))
    .forEach((p) => p.remove());

  // Sacadas la lista y la tabla, sus encabezados quedan huérfanos (y con el
  // <hr> separador al lado), duplicando los títulos que ya trae el panel. Se
  // eliminan los <h2> que quedaron sin contenido propio; "Specs" sobrevive si
  // debajo quedaron las notas por spec.
  [...wrapper.querySelectorAll('h2')].forEach((h) => {
    let next = h.nextElementSibling;
    const rules = [];
    while (next && next.tagName === 'HR') { rules.push(next); next = next.nextElementSibling; }
    if (next && next.tagName !== 'H2') return;
    rules.forEach((hr) => hr.remove());
    h.remove();
  });

  // El panel va después del encabezado y su bajada, antes del primer <hr>.
  const anchor = wrapper.querySelector('hr') || wrapper.firstChild;
  wrapper.insertBefore(buildStatusPanel(stages, specs), anchor);
}

// Habilita los checkboxes de listas de tareas (`- [ ]` / `- [x]`) que marked
// renderiza como <input disabled>, y los liga de vuelta a su línea exacta en
// el markdown fuente para persistir el cambio con un PUT al archivo completo.
// El emparejamiento asume que marked emite los checkboxes en el mismo orden
// en que aparecen en el texto (cierto en un render de documento completo, sin
// reordenamientos) — si el conteo no coincide, no se tocan (mejor no-editable
// que editar la línea equivocada). También vuelve editable el texto libre de
// las opciones "**Other:**", sincronizando su checkbox (texto no vacío ⇒
// tildado, vacío/`______` ⇒ destildado) — igual convención que ya usan los
// open-questions existentes.

// La plantilla de simple-spec-builder dice `**Other:**`, pero las specs se
// redactan en castellano y en los open-questions ya generados conviven las
// tres formas ("Other:", "Otro:", "Otra:"). Se tratan por igual: si solo se
// reconoce la inglesa, los archivos en castellano quedan sin campo editable
// y, peor, el guardado falla en silencio porque el reemplazo no matchea.
const OTHER_LABEL_RE = /^(?:Other|Otro|Otra)\s*:$/i;
const OTHER_LINE_RE = /^(\s*[-*+]\s+\[)[ xX](\]\s+\*\*(?:Other|Otro|Otra)\s*:\*\*)(.*)$/i;
const BLANK_BODY_RE = /^_+$/;

function wireInteractiveFields(container, project, taskId, fileName, initialContent) {
  let currentContent = initialContent;
  let saveChain = Promise.resolve();

  // Serializa los PUT (una promesa a la vez) para que dos ediciones rápidas
  // (p.ej. tildar un checkbox y tipear en "Other" casi al mismo tiempo) no
  // se pisen escribiendo cada una sobre un `currentContent` desactualizado.
  function persist(lineIndex, newLine) {
    // Se reescribe el archivo entero desde `currentContent`. Si mientras se
    // editaba llegó un cambio de disco (refresh diferido pendiente), ese buffer
    // está viejo y guardarlo pisaría lo que escribió el agente: se rechaza y
    // gana el disco, que el refresh diferido va a repintar enseguida.
    if (state.docStale) {
      // Sin el aviso, el checkbox vuelve solo a su estado anterior y parece
      // que la UI no responde.
      showToast('El archivo cambió en disco: se recarga', true);
      return Promise.reject(new Error('el archivo cambió en disco'));
    }

    const lines = currentContent.split('\n');
    lines[lineIndex] = newLine;
    const updated = lines.join('\n');
    currentContent = updated;

    const attempt = saveChain.then(() => saveFileContent(project, taskId, fileName, updated));
    saveChain = attempt.then(() => {}, () => {});
    return attempt.then(
      () => {
        state.fileCache.set(`${project}/${taskId}/${fileName}`, updated);
        showToast('Guardado ✓');
      },
      (err) => {
        showToast(`No se pudo guardar: ${err.message}`, true);
        throw err;
      }
    );
  }

  const lineIndices = [];
  currentContent.split('\n').forEach((line, i) => {
    if (/^\s*-\s\[[ xX]\]\s/.test(line)) lineIndices.push(i);
  });

  const checkboxes = [...container.querySelectorAll('input[type="checkbox"]')];
  if (checkboxes.length === 0 || checkboxes.length !== lineIndices.length) {
    if (checkboxes.length !== lineIndices.length) {
      console.warn('Checkboxes en el DOM no coinciden con los del markdown fuente; se dejan de solo lectura.');
    }
    return;
  }

  checkboxes.forEach((cb, idx) => {
    const lineIndex = lineIndices[idx];
    cb.disabled = false;

    cb.addEventListener('change', () => {
      const wasChecked = cb.checked;
      cb.disabled = true;
      const line = currentContent.split('\n')[lineIndex];
      const newLine = line.replace(/\[[ xX]\]/, wasChecked ? '[x]' : '[ ]');
      persist(lineIndex, newLine)
        .catch(() => { cb.checked = !wasChecked; })
        .finally(() => { cb.disabled = false; });
    });

    // La línea del markdown es la autoridad sobre si esta opción es un
    // "Otro" y cuál es su texto crudo. Detectarlo mirando el textContent del
    // <strong> fallaba con las variantes en castellano, y reconstruir el
    // markdown a partir del HTML ya renderizado aplanaba backticks, negritas
    // y links de las respuestas ya cargadas — y el blur dispara con solo
    // hacer foco y salir, sin editar nada.
    const li = cb.closest('li');
    const otherMatch = currentContent.split('\n')[lineIndex].match(OTHER_LINE_RE);
    if (!otherMatch) return;
    const label = li && [...li.querySelectorAll('strong')].find((s) => OTHER_LABEL_RE.test(s.textContent.trim()));
    if (!label) return;

    const rawBody = otherMatch[3].trim();
    const span = document.createElement('span');
    span.className = 'other-editable';
    span.contentEditable = 'true';
    span.spellcheck = false;
    span.dataset.placeholder = 'escribí la respuesta…';
    // Se edita el markdown crudo, no el HTML renderizado: es exactamente lo
    // que se va a escribir de vuelta al archivo, así el round-trip es fiel.
    span.textContent = BLANK_BODY_RE.test(rawBody) ? '' : rawBody;

    let node = label.nextSibling;
    while (node) {
      const next = node.nextSibling;
      node.remove();
      node = next;
    }
    label.after(span);

    span.addEventListener('blur', () => {
      const line = currentContent.split('\n')[lineIndex];
      const m = line.match(OTHER_LINE_RE);
      if (!m) return;
      // contentEditable inserta NBSP, y un pegado puede traer saltos de
      // línea: la respuesta tiene que entrar en una sola línea de markdown.
      // `\s` en JS ya matchea NBSP, así que un solo replace cubre ambos.
      const body = span.textContent.replace(/\s+/g, ' ').trim();
      const isFilled = body.length > 0 && !BLANK_BODY_RE.test(body);
      const newLine = `${m[1]}${isFilled ? 'x' : ' '}${m[2]} ${isFilled ? body : '______'}`;
      if (newLine === line) return;
      const wasChecked = cb.checked;
      span.classList.add('saving');
      cb.checked = isFilled;
      persist(lineIndex, newLine)
        .catch(() => { cb.checked = wasChecked; })
        .finally(() => span.classList.remove('saving'));
    });

    span.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      span.blur();
    });
  });
}

// Envuelve el SVG de un diagrama ya renderizado en un frame con
// zoom (rueda / botones), pan (arrastrar) y pantalla completa, sin
// depender de ninguna librería extra.
function buildDiagramFrame(svgMarkup) {
  const frame = document.createElement('div');
  frame.className = 'diagram-frame';
  frame.innerHTML = `
    <div class="diagram-toolbar">
      <button type="button" class="dz-out" title="Alejar">−</button>
      <span class="dz-level">100%</span>
      <button type="button" class="dz-in" title="Acercar">+</button>
      <button type="button" class="dz-reset" title="Ajustar a la ventana">Ajustar</button>
      <button type="button" class="dz-fullscreen" title="Pantalla completa">⛶ Expandir</button>
      <span class="dz-hint">rueda = zoom · arrastrar = mover · doble clic = ajustar</span>
    </div>
    <div class="diagram-viewport">
      <div class="diagram-pan"></div>
    </div>
  `;
  frame.querySelector('.diagram-pan').innerHTML = svgMarkup;
  initDiagramZoom(frame);
  return frame;
}

function initDiagramZoom(frame) {
  const viewport = frame.querySelector('.diagram-viewport');
  const pan = frame.querySelector('.diagram-pan');
  const svg = pan.querySelector('svg');
  const level = frame.querySelector('.dz-level');
  if (!svg) return;

  // Tamaño natural del diagrama: preferimos el viewBox (no se ve afectado
  // por cómo mermaid haya seteado width/height) y si no existe, el bbox.
  let natW, natH;
  if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width) {
    natW = svg.viewBox.baseVal.width;
    natH = svg.viewBox.baseVal.height;
  } else {
    const box = svg.getBBox();
    natW = box.width;
    natH = box.height;
  }
  svg.removeAttribute('height');
  svg.style.width = `${natW}px`;
  svg.style.height = 'auto';
  svg.style.display = 'block';

  const MIN_SCALE = 0.15;
  const MAX_SCALE = 8;
  const state = { scale: 1, x: 0, y: 0 };

  function apply() {
    pan.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    level.textContent = `${Math.round(state.scale * 100)}%`;
  }

  function fit() {
    const vw = Math.max(viewport.clientWidth - 24, 40);
    const vh = Math.max(viewport.clientHeight - 24, 40);
    state.scale = Math.min(vw / natW, vh / natH, 1) || 1;
    state.x = (viewport.clientWidth - natW * state.scale) / 2;
    state.y = (viewport.clientHeight - natH * state.scale) / 2;
    apply();
  }

  function zoomBy(factor, clientX, clientY) {
    const prevScale = state.scale;
    const nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, prevScale * factor));
    if (nextScale === prevScale) return;
    const rect = viewport.getBoundingClientRect();
    const px = clientX !== undefined ? clientX - rect.left : viewport.clientWidth / 2;
    const py = clientY !== undefined ? clientY - rect.top : viewport.clientHeight / 2;
    // Mantiene fijo el punto bajo el cursor mientras cambia la escala.
    state.x = px - ((px - state.x) / prevScale) * nextScale;
    state.y = py - ((py - state.y) / prevScale) * nextScale;
    state.scale = nextScale;
    apply();
  }

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
  }, { passive: false });

  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  viewport.addEventListener('pointerdown', (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    viewport.setPointerCapture(e.pointerId);
    viewport.classList.add('dragging');
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.x += e.clientX - lastX;
    state.y += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    apply();
  });
  const stopDrag = () => { dragging = false; viewport.classList.remove('dragging'); };
  viewport.addEventListener('pointerup', stopDrag);
  viewport.addEventListener('pointercancel', stopDrag);
  viewport.addEventListener('pointerleave', stopDrag);
  viewport.addEventListener('dblclick', fit);

  frame.querySelector('.dz-in').addEventListener('click', () => zoomBy(1.25));
  frame.querySelector('.dz-out').addEventListener('click', () => zoomBy(1 / 1.25));
  frame.querySelector('.dz-reset').addEventListener('click', fit);
  frame.querySelector('.dz-fullscreen').addEventListener('click', () => {
    frame.classList.toggle('fullscreen');
    requestAnimationFrame(fit);
  });

  frame.__fit = fit;
  requestAnimationFrame(fit);
}

// Esc cierra el diagrama que esté en pantalla completa (a lo sumo uno a la vez).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const fs = document.querySelector('.diagram-frame.fullscreen');
  if (!fs) return;
  fs.classList.remove('fullscreen');
  if (fs.__fit) requestAnimationFrame(fs.__fit);
});

// ---------------------------------------------------------------------------
// Auto-refresh
// La extensión vigila la carpeta de la task abierta y empuja 'taskChanged'
// cuando cambia alguno de sus .md (el caso normal: un agente reescribiendo las
// specs con el visor abierto al lado). Reemplaza al botón "Actualizar", que
// obligaba a acordarse de apretarlo para ver texto que ya estaba en disco.
// Solo se vigila la task abierta, no la raíz entera: es lo único que se está
// mirando, y un watcher sobre todos los proyectos dispararía sin parar.
// ---------------------------------------------------------------------------

// Le dice al host qué carpeta mirar; sin task seleccionada apaga el watcher.
function syncWatch() {
  callHost('watch', { project: state.selectedProject, task: state.selectedId })
    .catch(() => {});
}

// Repintar reemplaza el DOM del documento: si el refresh cae justo mientras se
// tipea en un campo "Other:", se pierde el foco y el texto a medio escribir.
// En ese caso se difiere hasta que el campo suelte el foco.
let pendingRefresh = false;

function editingInDoc() {
  const active = document.activeElement;
  return !!active && active.isContentEditable && el('doc').contains(active);
}

async function refreshOpenTask() {
  if (editingInDoc()) {
    pendingRefresh = true;
    state.docStale = true;
    scheduleRetry();
    return;
  }
  pendingRefresh = false;

  const doc = el('doc');
  const scroll = doc.scrollTop;
  const fileName = state.selectedFile;

  state.fileCache.clear();
  // Recarga la lista además del documento: el cambio puede haber agregado o
  // borrado archivos de la task, y eso mueve solapas, contadores y fecha.
  await loadTasks();

  const task = state.tasks.find((t) => t.id === state.selectedId);
  if (!task) {
    // La task desapareció del disco (renombrada, borrada).
    state.selectedId = null;
    state.selectedFile = null;
    syncWatch();
    await renderTabs();
    return;
  }
  // El archivo abierto puede haberse borrado o renombrado: se cae a la primera
  // solapa en vez de dejar un "File not found" en pantalla.
  if (!task.files.some((f) => f.name === fileName)) state.selectedFile = null;
  await renderTabs();
  doc.scrollTop = scroll;
}

// El reintento es un timer y no un listener de 'focusout' porque el foco puede
// quedarse en el campo indefinidamente: con el evento, un cursor olvidado ahí
// dejaba el documento congelado sin aviso. Solo corre mientras hay un refresh
// diferido y se apaga solo.
let retryTimer = null;
function scheduleRetry() {
  if (retryTimer) return;
  retryTimer = setInterval(() => {
    if (!pendingRefresh) {
      clearInterval(retryTimer);
      retryTimer = null;
      return;
    }
    if (!editingInDoc()) refreshOpenTask();
  }, 1000);
}

el('project-select').addEventListener('change', (e) => selectProject(e.target.value));

el('toggle-table').addEventListener('click', () => {
  setTasksCollapsed(!document.body.classList.contains('tasks-collapsed'));
});
// Se restaura antes de cargar datos para que no se vea el listado abrirse y
// cerrarse en el arranque.
setTasksCollapsed(!!(vscode.getState() || {}).tasksCollapsed);

el('change-root').addEventListener('click', async () => {
  const { genesysDir, cancelled } = await callHost('pickRoot');
  if (cancelled) return;
  // No se espera al evento de config: el push de `rootChanged` llega igual,
  // pero refrescar acá deja la UI al día aunque el listener no dispare
  // (p. ej. si se re-elige la misma carpeta ya configurada).
  setRootLabel(genesysDir);
  loadRoot();
});

// La raíz se pide antes de cargar nada: el estado vacío de la tabla depende
// de si hay carpeta configurada o si la carpeta no tiene proyectos.
callHost('meta')
  .then((meta) => setRootLabel(meta.genesysDir))
  .catch(() => {})
  .then(() => loadRoot((vscode.getState() || {}).lastProject));
</script>
